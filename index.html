        const AlertTriangle = (p) => <Icon {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Icon>;
        const LogOut = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Icon>;
        const Settings = (p) => <Icon {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></Icon>;

        // --- MOCK DATA ---
        const AGE_BRACKETS = [
            '0-18', '19-23', '24-28', '29-33', '34-38', 
            '39-43', '44-48', '49-53', '54-58', '59+'
        ];

        const MOCK_PLANS = [
            { id: 'p1', operator: 'Hapvida', name: 'Nosso Médico RMSP', accommodation: 'Enfermaria', copay: 'Com Coparticipação Parcial', network: 'Rede Própria', refund: 'Sem Reembolso', prices: { '0-18': 154.90, '19-23': 185.88, '24-28': 223.05, '29-33': 267.66, '34-38': 321.20, '39-43': 385.44, '44-48': 462.52, '49-53': 555.03, '54-58': 666.03, '59+': 932.44 } },
            { id: 'p2', operator: 'Hapvida', name: 'Mix', accommodation: 'Apartamento', copay: 'Sem Coparticipação', network: 'Rede Ampla', refund: 'Sem Reembolso', prices: { '0-18': 210.50, '19-23': 252.60, '24-28': 303.12, '29-33': 363.74, '34-38': 436.49, '39-43': 523.79, '44-48': 628.55, '49-53': 754.26, '54-58': 905.11, '59+': 1267.15 } },
            { id: 'p3', operator: 'NotreDame', name: 'Smart 200 SP', accommodation: 'Enfermaria', copay: 'Com Coparticipação Total', network: 'Rede Própria', refund: 'Sem Reembolso', prices: { '0-18': 165.00, '19-23': 198.00, '24-28': 237.60, '29-33': 285.12, '34-38': 342.14, '39-43': 410.57, '44-48': 492.68, '49-53': 591.22, '54-58': 709.46, '59+': 993.24 } },
            { id: 'p4', operator: 'NotreDame', name: 'Advance 600', accommodation: 'Apartamento', copay: 'Sem Coparticipação', network: 'Rede Nacional', refund: 'Reembolso Padrão', prices: { '0-18': 350.00, '19-23': 420.00, '24-28': 504.00, '29-33': 604.80, '34-38': 725.76, '39-43': 870.91, '44-48': 1045.09, '49-53': 1254.11, '54-58': 1504.93, '59+': 2106.90 } }
        ];

        const RECENT_QUOTES = [
            { id: 1, type: 'PME', client: 'Tech Solutions LTDA', location: 'São Paulo/SP', date: 'Hoje, 10:45', value: 'R$ 2.450,00', plans: 2 },
            { id: 2, type: 'PF', client: 'Maria Silva', location: 'Campinas/SP', date: 'Hoje, 09:12', value: 'R$ 540,00', plans: 3 },
            { id: 3, type: 'Adesão', client: 'João Souza (CREA)', location: 'Belo Horizonte/MG', date: 'Ontem, 16:30', value: 'R$ 890,00', plans: 1 },
        ];

        // --- TOAST COMPONENT ---
        function Toast({ message, type = 'success', onClose }) {
            useEffect(() => {
                const t = setTimeout(onClose, 3500);
                return () => clearTimeout(t);
            }, []);
            const styles = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-red-600 text-white',
                info: 'bg-[#006B6C] text-white',
                warning: 'bg-orange-500 text-white',
            };
            return (
                <div className="fixed bottom-6 right-6 z-[100] animate-[slideIn_0.3s_ease-out]">
                    <div className={`${styles[type]} px-5 py-3 rounded-lg shadow-2xl flex items-center gap-3 min-w-[280px] max-w-md`}>
                        <span className="shrink-0">
                            {type === 'success' ? <CheckCircle2 className="w-5 h-5" /> : type === 'error' ? <X className="w-5 h-5" /> : <Bell className="w-5 h-5" />}
                        </span>
                        <p className="text-sm font-medium flex-1">{message}</p>
                        <button onClick={onClose} className="opacity-70 hover:opacity-100 transition-opacity">
                            <X className="w-4 h-4" />
                        </button>
                    </div>
                </div>
            );
        }

        // --- MODAL BASE ---
        function Modal({ title, children, onClose, size = 'md' }) {
            useEffect(() => {
                const handleEsc = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', handleEsc);
                return () => window.removeEventListener('keydown', handleEsc);
            }, []);

            const sizes = { sm: 'max-w-md', md: 'max-w-2xl', lg: 'max-w-4xl' };

            return (
                <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 animate-[fadeIn_0.2s_ease-out]">
                    <div className="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onClick={onClose}></div>
                    <div className={`relative bg-white rounded-xl shadow-2xl w-full ${sizes[size]} max-h-[90vh] flex flex-col animate-[scaleIn_0.2s_ease-out]`}>
                        <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between shrink-0">
                            <h3 className="text-lg font-bold text-slate-800">{title}</h3>
                            <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded transition-colors">
                                <X className="w-5 h-5" />
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1">
                            {children}
                        </div>
                    </div>
                </div>
            );
        }

        // --- DROPDOWN ---
        function Dropdown({ trigger, children }) {
            const [open, setOpen] = useState(false);
            return (
                <div className="relative">
                    <button onClick={() => setOpen(!open)} className="block">
                        {trigger}
                    </button>
                    {open && (
                        <>
                            <div className="fixed inset-0 z-40" onClick={() => setOpen(false)}></div>
                            <div className="absolute right-0 mt-2 w-72 bg-white rounded-lg shadow-xl border border-slate-200 z-50 animate-[slideIn_0.2s_ease-out] overflow-hidden">
                                {children}
                            </div>
                        </>
                    )}
                </div>
            );
        }

        // --- PLACEHOLDER VIEW ---
        function PlaceholderView({ view, onBack }) {
            const configs = {
                reports: { title: 'Relatório de Cotação', desc: 'Visualize, filtre e exporte todos os relatórios de cotações realizadas.', icon: <FileText /> },
                crm: { title: 'CRM - Clientes', desc: 'Gerencie sua base de clientes, histórico de contatos e oportunidades.', icon: <Users /> },
                pipeline: { title: 'Pipeline de Vendas', desc: 'Acompanhe o funil de vendas e o progresso de cada negociação.', icon: <KanbanSquare /> },
                tutorials: { title: 'Tutoriais', desc: 'Aprenda a usar todas as funcionalidades da plataforma através de vídeos.', icon: <PlayCircle /> },
                mcp: { title: 'Conectar MCP', desc: 'Integre a plataforma a sistemas MCP externos para automatizar processos.', icon: <LinkIcon /> },
                whatsapp: { title: 'Extensão WhatsApp', desc: 'Instale a extensão para integrar seu WhatsApp diretamente à plataforma.', icon: <MessageSquare /> },
                clients: { title: 'Meus Clientes', desc: 'Acesse rapidamente sua carteira de clientes cadastrados.', icon: <Users /> },
                card: { title: 'Cartão de Visita', desc: 'Gere e compartilhe seu cartão de visita digital personalizado.', icon: <UserCircle /> },
                tasks: { title: 'Minhas Tarefas', desc: 'Gerencie suas tarefas do dia a dia e mantenha o foco no que importa.', icon: <CheckCircle2 /> },
                chat: { title: 'Chat IA', desc: 'Converse com o assistente virtual para tirar dúvidas e agilizar tarefas.', icon: <MessageSquare /> },
            };
            const config = configs[view] || configs.reports;
            return (
                <div className="p-8 max-w-7xl mx-auto animate-[fadeIn_0.3s_ease-in-out]">
                    <button onClick={onBack} className="flex items-center gap-2 text-slate-500 hover:text-[#006B6C] text-sm font-medium mb-4 transition-colors">
                        <ArrowLeft className="w-4 h-4" /> Voltar ao Início
                    </button>
                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-12 text-center">
                        <div className="w-20 h-20 bg-teal-50 rounded-full flex items-center justify-center mx-auto mb-4 text-[#006B6C]">
                            {React.cloneElement(config.icon, { className: 'w-10 h-10' })}
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800 mb-2">{config.title}</h2>
                        <p className="text-slate-500 max-w-md mx-auto">{config.desc}</p>
                        <div className="mt-6 inline-flex items-center gap-2 px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm font-medium">
                            <span className="w-2 h-2 bg-orange-400 rounded-full animate-pulse"></span>
                            Módulo em desenvolvimento
                        </div>
                    </div>
                </div>
            );
        }

        // --- PLAN MODAL (NOVO/EDITAR) ---
        function PlanModal({ plan, onSave, onClose }) {
            const [form, setForm] = useState(plan || {
                operator: '', name: '', accommodation: 'Enfermaria',
                copay: 'Sem Coparticipação', network: 'Rede Própria', refund: 'Sem Reembolso',
                prices: AGE_BRACKETS.reduce((acc, b) => ({ ...acc, [b]: 0 }), {})
            });

            const setField = (field, value) => setForm(prev => ({ ...prev, [field]: value }));
            const setPrice = (bracket, value) => setForm(prev => ({
                ...prev,
                prices: { ...prev.prices, [bracket]: parseFloat(value) || 0 }
            }));

            const isValid = form.operator.trim() && form.name.trim();

            return (
                <Modal title={plan ? 'Editar Plano' : 'Novo Plano'} onClose={onClose} size="lg">
                    <div className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="text-sm font-medium text-slate-700 block mb-1">Operadora *</label>
                                <input type="text" value={form.operator} onChange={e => setField('operator', e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#006B6C]/20 focus:border-[#006B6C] outline-none" placeholder="Ex: Hapvida" />
                            </div>
                            <div>
                                <label className="text-sm font-medium text-slate-700 block mb-1">Nome do Plano *</label>
                                <input type="text" value={form.name} onChange={e => setField('name', e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#006B6C]/20 focus:border-[#006B6C] outline-none" placeholder="Ex: Mix" />
                            </div>
                            <div>
                                <label className="text-sm font-medium text-slate-700 block mb-1">Acomodação</label>
                                <select value={form.accommodation} onChange={e => setField('accommodation', e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#006B6C]/20 focus:border-[#006B6C] outline-none">
                                    <option>Enfermaria</option>
                                    <option>Apartamento</option>
                                </select>
                            </div>
                            <div>
                                <label className="text-sm font-medium text-slate-700 block mb-1">Coparticipação</label>
                                <select value={form.copay} onChange={e => setField('copay', e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#006B6C]/20 focus:border-[#006B6C] outline-none">
                                    <option>Sem Coparticipação</option>
                                    <option>Com Coparticipação Parcial</option>
                                    <option>Com Coparticipação Total</option>
                                </select>
                            </div>
                            <div>
                                <label className="text-sm font-medium text-slate-700 block mb-1">Abrangência</label>
                                <select value={form.network} onChange={e => setField('network', e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#006B6C]/20 focus:border-[#006B6C] outline-none">
                                    <option>Rede Própria</option>
                                    <option>Rede Ampla</option>
                                    <option>Rede Nacional</option>
                                </select>
                            </div>
                            <div>
                                <label className="text-sm font-medium text-slate-700 block mb-1">Reembolso</label>
                                <select value={form.refund} onChange={e => setField('refund', e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#006B6C]/20 focus:border-[#006B6C] outline-none">
                                    <option>Sem Reembolso</option>
                                    <option>Reembolso Padrão</option>
                                    <option>Reembolso Premium</option>
                                </select>
                            </div>
                        </div>

                    showToast(`Plano "${form.name}" adicionado com sucesso!`, 'success');
                    setIsNewPlan(false);

                if (deletingPlan) {

        // --- WIZARD ---
        function WizardView({ onCancel, initialType, plans, showToast }) {
            const [step, setStep] = useState(1);
            const [quoteData, setQuoteData] = useState({
                type: initialType || '',
                clientName: '',
                clientPhone: '',
                clientEmail: '',
                ages: AGE_BRACKETS.reduce((acc, bracket) => ({ ...acc, [bracket]: 0 }), {}),
                state: '',
                city: '',
                accommodation: 'Todas',
                copay: 'Todas',
                selectedPlans: []

            const updateData = (field, value) => {
                setQuoteData(prev => ({ ...prev, [field]: value }));
            };

            const nextStep = () => setStep(s => Math.min(4, s + 1));
            const prevStep = () => setStep(s => Math.max(1, s - 1));

            const isNextDisabled = () => {
                if (step === 1 && !quoteData.type) return true;
                if (step === 2 && (!quoteData.clientName || Object.values(quoteData.ages).reduce((a, b) => a + b, 0) === 0)) return true;
                if (step === 3 && (!quoteData.state || !quoteData.city)) return true;
                return false;

            const steps = ["Tipo de Tabela", "Dados e Vidas", "Localização e Filtros", "Comparativo"];

            return (
                <div className="flex flex-col h-full bg-white print:bg-white">
                    <div className="border-b border-slate-200 px-8 py-4 bg-slate-50 flex items-center justify-between sticky top-0 z-10 print:hidden shrink-0">
                        <div className="flex items-center gap-4">

                                <ArrowLeft className="w-5 h-5" />
                            </button>
                            <div>
                                <h2 className="text-xl font-bold text-slate-800">Nova Cotação de Saúde</h2>
                                <p className="text-sm text-slate-500">Siga os passos para gerar o comparativo</p>
                            </div>
                        </div>

                        <div className="hidden md:flex items-center gap-2">
                            {steps.map((label, idx) => {
                                const num = idx + 1;
                                const isActive = step === num;
                                const isPast = step > num;
                                return (
                                    <div key={num} className="flex items-center gap-2">
                                        <div className={`flex items-center justify-center w-8 h-8 rounded-full text-sm font-semibold border-2 transition-colors ${
                                            isActive ? 'border-[#006B6C] bg-[#006B6C] text-white' :
                                            isPast ? 'border-[#006B6C] bg-white text-[#006B6C]' :
                                            'border-slate-200 bg-white text-slate-400'
                                        }`}>
                                            {isPast ? <Check className="w-4 h-4" /> : num}
                                        </div>
                                        <span className={`text-sm font-medium hidden lg:block ${isActive ? 'text-slate-900' : 'text-slate-400'}`}>
                                            {label}
                                        </span>
                                        {num < 4 && <div className={`w-8 h-px ${isPast ? 'bg-[#006B6C]' : 'bg-slate-200'}`} />}
                                    </div>
                                );
                            })}

                    </div>

                    <div className="flex-1 overflow-auto p-8 relative">
                        <div className={`max-w-4xl mx-auto h-full ${step === 4 ? 'max-w-[95%] print:max-w-none print:p-0' : ''}`}>
                            {step === 1 && <Step1Type type={quoteData.type} setType={(v) => updateData('type', v)} />}
                            {step === 2 && (
                                <Step2Data 
                                    data={quoteData} 
                                    updateData={updateData} 
                                    updateAge={(bracket, change) => {
                                        const current = quoteData.ages[bracket];
                                        const next = Math.max(0, current + change);
                                        updateData('ages', { ...quoteData.ages, [bracket]: next });
                                    }}
                                />
                            )}
                            {step === 3 && <Step3Filters data={quoteData} updateData={updateData} />}
                            {step === 4 && (
                                <Step4Compare 
                                    data={quoteData} 
                                    updateData={updateData} 
                                    plans={plans}
                                    showToast={showToast}
                                />
                            )}
                        </div>
                    </div>

                    {step < 4 && (
                        <div className="border-t border-slate-200 p-4 bg-white flex justify-between items-center print:hidden shrink-0">
                            <button 
                                onClick={step === 1 ? onCancel : prevStep}
                                className="px-6 py-2.5 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition-colors"
                            >
                                {step === 1 ? 'Cancelar' : 'Voltar'}
                            </button>
                            
                            <button 
                                onClick={nextStep}
                                disabled={isNextDisabled()}
                                className={`px-8 py-2.5 rounded-lg font-semibold flex items-center gap-2 transition-all ${
                                    isNextDisabled() 
                                        ? 'bg-slate-100 text-slate-400 cursor-not-allowed' 
                                        : 'bg-[#C84B00] text-white hover:bg-orange-700 shadow-md hover:shadow-lg'
                                }`}
                            >
                                Próxima Etapa
                                <ArrowRight className="w-4 h-4" />
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function Step1Type({ type, setType }) {

        function Step2Data({ data, updateData, updateAge }) {

                                    onChange={(e) => updateData('clientPhone', e.target.value)}
                                    className="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#006B6C]/20 focus:border-[#006B6C] outline-none transition-all"
                                    placeholder="(11) 99999-9999"

                    </div>

                    <div className="bg-slate-50 p-6 rounded-xl border border-slate-200">

                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-x-6 gap-y-4">

                                        >

                            <select 
                                value={data.state}
                                onChange={(e) => updateData('state', e.target.value)}

        function Step4Compare({ data, updateData, plans, showToast }) {
            const [showLimitWarning, setShowLimitWarning] = useState(false);
            const warningTimeoutRef = useRef(null);

            const availablePlans = plans.filter(plan => {
                let accMatch = data.accommodation === 'Todas' || plan.accommodation === data.accommodation;
                let copayMatch = false;
                
                if (data.copay === 'Todas') copayMatch = true;
                else if (data.copay === 'Com Coparticipação') copayMatch = plan.copay.includes('Com Coparticipação');
                else if (data.copay === 'Sem Coparticipação') copayMatch = plan.copay === 'Sem Coparticipação';
                
                return accMatch && copayMatch;
            });

            const togglePlanSelection = (planId) => {
                const validSelected = data.selectedPlans.filter(id => availablePlans.some(p => p.id === id));
                if (validSelected.includes(planId)) {
                    updateData('selectedPlans', validSelected.filter(id => id !== planId));
                    setShowLimitWarning(false);
                } else {
                    if (validSelected.length >= 4) {
                        setShowLimitWarning(true);
                        if (warningTimeoutRef.current) clearTimeout(warningTimeoutRef.current);
                        warningTimeoutRef.current = setTimeout(() => setShowLimitWarning(false), 3000);
                        return;
                    }
                    updateData('selectedPlans', [...validSelected, planId]);
                }
            };

            const selectedPlanObjects = data.selectedPlans
                .map(id => availablePlans.find(p => p.id === id))
                .filter(Boolean);
            const totalVidas = Object.values(data.ages).reduce((a, b) => a + b, 0);
            const activeAgeBrackets = AGE_BRACKETS.filter(bracket => data.ages[bracket] > 0);

            const calculateTotal = (plan) => {
                let total = 0;
                activeAgeBrackets.forEach(bracket => {
                    total += (plan.prices[bracket] * data.ages[bracket]);
                });
                return total;
            };

            const handlePrint = () => window.print();

            const handleSaveQuote = () => {
                try {
                    const saved = JSON.parse(localStorage.getItem('cotadorpro_quotes') || '[]');
                    const quote = {
                        ...data,
                        plans: selectedPlanObjects,
                        totalVidas,
                        savedAt: new Date().toISOString(),
                        id: Date.now()
                    };
                    saved.push(quote);
                    localStorage.setItem('cotadorpro_quotes', JSON.stringify(saved));
                    showToast('Cotação salva com sucesso!', 'success');
                } catch (err) {
                    showToast('Erro ao salvar cotação.', 'error');
                }
            };

            return (
                <div className="h-full flex flex-col animate-[fadeIn_0.3s_ease-in-out]">
                    <div className="flex justify-between items-end mb-6 print:hidden flex-wrap gap-3">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">Comparativo de Planos</h2>
                            <p className="text-slate-500 text-sm mt-1">Cliente: <span className="font-semibold text-slate-700">{data.clientName}</span> | {totalVidas} vida(s) | {data.city}/{data.state}</p>
                        </div>
                        <div className="flex gap-3">
                            <button 
                                onClick={handleSaveQuote}
                                className="px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg flex items-center gap-2 hover:bg-slate-50 transition-colors shadow-sm font-medium"
                            >
                                <Save className="w-4 h-4" />
                                Salvar Cotação
                            </button>
                            <button 
                                onClick={handlePrint}
                                disabled={selectedPlanObjects.length === 0}
                                className="px-4 py-2 bg-[#C84B00] text-white rounded-lg flex items-center gap-2 hover:bg-orange-700 transition-colors shadow-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                <Printer className="w-4 h-4" />
                                Gerar PDF
                            </button>
                        </div>
                    </div>

                    <div className="hidden print:block mb-8 border-b-2 border-[#006B6C] pb-4">
                        <div className="flex justify-between items-center">
                            <h1 className="text-3xl font-bold text-[#006B6C] flex items-center gap-2">
                                <HeartPulse className="w-8 h-8" />
                                Proposta Comercial
                            </h1>
                            <div className="text-right">
                                <p className="font-bold text-slate-800">Consultor: Leonardo Aguiar</p>
                                <p className="text-slate-600">leonardo@corretora.com.br</p>
                                <p className="text-slate-600">(11) 98888-7777</p>
                            </div>
                        </div>
                        <div className="mt-6 p-4 bg-slate-50 rounded-lg border border-slate-200">
                            <h2 className="text-xl font-bold text-slate-800 mb-2">Dados do Cliente</h2>
                            <div className="flex gap-8 text-sm flex-wrap">
                                <p><strong>Nome:</strong> {data.clientName || 'Não informado'}</p>
                                <p><strong>Modalidade:</strong> {data.type}</p>
                                <p><strong>Localidade:</strong> {data.city}/{data.state}</p>
                                <p><strong>Total de Vidas:</strong> {totalVidas}</p>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-6 min-h-0">
                        <div className="lg:col-span-1 bg-white border border-slate-200 rounded-xl flex flex-col overflow-hidden shadow-sm print:hidden">
                            <div className="p-4 bg-slate-50 border-b border-slate-200 relative">
                                <h3 className="font-bold text-slate-800">Planos Disponíveis</h3>
                                <p className="text-xs text-slate-500 mt-1">{availablePlans.length} encontrados</p>
                            </div>
                            
                            {showLimitWarning && (
                                <div className="mx-4 mt-4 p-3 bg-orange-50 border border-orange-200 rounded-lg flex items-start gap-2 animate-[slideIn_0.2s_ease-out]">
                                    <span className="text-orange-600 mt-0.5"><X className="w-4 h-4" /></span>
                                    <p className="text-sm text-orange-800">
                                        <strong className="block mb-0.5">Limite atingido</strong>
                                        Máximo de 4 planos por comparativo.
                                    </p>
                                </div>
                            )}

                            <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                {availablePlans.length === 0 ? (
                                    <p className="text-sm text-slate-500 text-center py-8">Nenhum plano atende aos filtros.</p>
                                ) : (
                                    availablePlans.map(plan => {
                                        const isSelected = data.selectedPlans.includes(plan.id);
                                        const planTotal = calculateTotal(plan);
                                        return (
                                            <div 
                                                key={plan.id}
                                                onClick={() => togglePlanSelection(plan.id)}
                                                className={`p-3 rounded-lg border-2 cursor-pointer transition-all ${
                                                    isSelected 
                                                        ? 'border-[#006B6C] bg-teal-50/30' 
                                                        : 'border-slate-100 hover:border-slate-300 bg-white'
                                                }`}
                                            >
                                                <div className="flex justify-between items-start mb-2">
                                                    <div>
                                                        <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">{plan.operator}</span>
                                                        <h4 className="font-bold text-slate-800 leading-tight">{plan.name}</h4>
                                                    </div>
                                                    <div className={`w-5 h-5 rounded border flex items-center justify-center mt-1 shrink-0 ${
                                                        isSelected ? 'bg-[#006B6C] border-[#006B6C] text-white' : 'border-slate-300'
                                                    }`}>
                                                        {isSelected && <Check className="w-3.5 h-3.5" />}
                                                    </div>
                                                </div>
                                                <div className="flex gap-2 flex-wrap text-xs text-slate-600 mb-3">
                                                    <span className="bg-slate-100 px-1.5 py-0.5 rounded">{plan.accommodation}</span>
                                                    <span className="bg-slate-100 px-1.5 py-0.5 rounded truncate max-w-[120px]">{plan.copay}</span>
                                                </div>
                                                <div className="pt-2 border-t border-slate-100/50 flex justify-between items-center">
                                                    <span className="text-xs text-slate-500">Total Mensal</span>
                                                    <span className="font-bold text-[#006B6C]">
                                                        R$ {planTotal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        <div className="lg:col-span-3 bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm flex flex-col print:col-span-4 print:border-none print:shadow-none">
                            {selectedPlanObjects.length === 0 ? (
                                <div className="flex-1 flex flex-col items-center justify-center p-8 text-center print:hidden">
                                    <div className="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mb-4">
                                        <Building className="w-8 h-8 text-slate-300" />
                                    </div>
                                    <h3 className="text-lg font-bold text-slate-700">Nenhum plano selecionado</h3>
                                    <p className="text-slate-500 mt-2 max-w-sm">Selecione os planos na lista ao lado para gerar o comparativo lado a lado.</p>
                                </div>
                            ) : (
                                <div className="flex-1 overflow-x-auto print:overflow-visible">
                                    <table className="w-full min-w-max border-collapse">
                                        <thead>
                                            <tr>
                                                <th className="bg-slate-50 border-b border-slate-200 p-4 text-left font-semibold text-slate-600 w-48 sticky left-0 z-10 print:static print:bg-transparent">
                                                    Características
                                                </th>
                                                {selectedPlanObjects.map(plan => (
                                                    <th key={plan.id} className="bg-slate-50 border-b border-l border-slate-200 p-4 min-w-[220px] relative print:bg-transparent">
                                                        <button 
                                                            onClick={() => togglePlanSelection(plan.id)}
                                                            className="absolute top-2 right-2 p-1 text-slate-400 hover:text-red-500 transition-colors print:hidden"
                                                            title="Remover plano"
                                                        >
                                                            <X className="w-4 h-4" />
                                                        </button>
                                                        
                                                        <div className="text-center">
                                                            <span className="text-xs font-bold text-[#006B6C] uppercase tracking-wider block mb-1">{plan.operator}</span>
                                                            <span className="text-lg font-bold text-slate-800 block leading-tight">{plan.name}</span>
                                                        </div>
                                                    </th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody className="text-sm">
                                            <TableRow label="Acomodação" plans={selectedPlanObjects} field="accommodation" />
                                            <TableRow label="Coparticipação" plans={selectedPlanObjects} field="copay" />
                                            <TableRow label="Abrangência" plans={selectedPlanObjects} field="network" />
                                            <TableRow label="Reembolso" plans={selectedPlanObjects} field="refund" />
                                            
                                            <tr>
                                                <td colSpan={selectedPlanObjects.length + 1} className="bg-[#006B6C]/5 p-3 font-bold text-[#006B6C] text-xs uppercase tracking-wider border-y border-slate-200 sticky left-0 print:static print:bg-slate-100">
                                                    Composição de Preços (Vidas por Faixa Etária)
                                                </td>
                                            </tr>
                                            
                                            {activeAgeBrackets.map(bracket => (
                                                <tr key={bracket} className="hover:bg-slate-50 transition-colors">
                                                    <td className="p-3 border-b border-slate-200 font-medium text-slate-700 bg-white sticky left-0 z-10 print:static print:bg-transparent">
                                                        <span className="inline-block w-6 text-center font-bold mr-2 text-[#006B6C]">{data.ages[bracket]}x</span>
                                                        {bracket} anos
                                                    </td>
                                                    {selectedPlanObjects.map(plan => {
                                                        const unitPrice = plan.prices[bracket];
                                                        const rowTotal = unitPrice * data.ages[bracket];
                                                        return (
                                                            <td key={plan.id} className="p-3 border-b border-l border-slate-200 text-center print:bg-transparent">
                                                                <div className="flex flex-col">
                                                                    <span className="text-slate-500 text-xs">R$ {unitPrice.toFixed(2)} un.</span>
                                                                    <span className="font-semibold text-slate-800">R$ {rowTotal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                                                                </div>
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            ))}

                                            <tr>
                                                <td className="p-4 border-b border-slate-200 font-bold text-slate-800 bg-slate-50 sticky left-0 z-10 text-lg print:static print:bg-transparent">
                                                    Total Mensal Estimado
                                                </td>
                                                {selectedPlanObjects.map(plan => (
                                                    <td key={plan.id} className="p-4 border-b border-l border-slate-200 text-center bg-slate-50 print:bg-transparent">
                                                        <span className="text-2xl font-black text-[#C84B00]">
                                                            R$ {calculateTotal(plan).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                                        </span>
                                                    </td>
                                                ))}
                                            </tr>
                                            
                                            <tr>
                                                <td className="p-4 text-xs text-slate-500 bg-white sticky left-0 print:static" colSpan={selectedPlanObjects.length + 1}>
                                                    * Valores sujeitos a alteração sem aviso prévio. Taxa de adesão/cadastro não inclusa nesta estimativa.
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function TableRow({ label, plans, field }) {
            return (
                <tr className="hover:bg-slate-50/50 transition-colors">
                    <td className="p-3 border-b border-slate-200 font-medium text-slate-600 bg-white sticky left-0 z-10 print:static print:bg-transparent">
                        {label}
                    </td>
                    {plans.map(plan => (
                        <td key={plan.id} className="p-3 border-b border-l border-slate-200 text-center text-slate-800 font-medium print:bg-transparent">
                            {plan[field]}
                        </td>
                    ))}
                </tr>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CotadorApp />);
    </script>
</body>
</html>
