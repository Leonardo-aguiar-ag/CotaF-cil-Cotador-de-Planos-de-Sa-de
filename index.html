<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CotaFácil — Cotador de Planos de Saúde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#1e40af; --brand-2:#0d9488; --brand-3:#6366f1;
  --accent:#f59e0b; --accent-2:#f97316;
  --ink:#0f172a; --ink-2:#1e293b; --muted:#64748b; --muted-2:#94a3b8;
  --bg:#f8fafc; --bg-2:#f1f5f9; --card:#ffffff; --line:#e2e8f0; --line-2:#f1f5f9;
  --ok:#059669; --ok-bg:#ecfdf5; --warn:#d97706; --warn-bg:#fffbeb; --err:#dc2626; --err-bg:#fef2f2;
  --radius:16px; --radius-sm:10px; --radius-lg:22px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --shadow:0 2px 8px rgba(15,23,42,.06),0 8px 24px -8px rgba(15,23,42,.08);
  --shadow-lg:0 20px 50px -12px rgba(15,23,42,.25),0 8px 16px -8px rgba(15,23,42,.12);
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;border-radius:11px;font-weight:600;font-size:14px;transition:all .15s cubic-bezier(.4,0,.2,1)}
button:active{transform:scale(.98)}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);outline:none;transition:all .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(30,64,175,.1)}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}
.field{margin-bottom:15px}
.row{display:grid;gap:15px}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:720px){.row.c2,.row.c3{grid-template-columns:1fr}}
.hidden{display:none!important}

/* ========== BUTTONS ========== */
.btn{padding:11px 20px;background:linear-gradient(135deg,var(--brand),var(--brand-3));color:#fff;box-shadow:0 1px 2px rgba(30,64,175,.2),0 4px 12px -2px rgba(30,64,175,.35);font-size:14px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px -2px rgba(30,64,175,.45)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:var(--shadow-sm)}
.btn.ghost:hover{background:var(--bg-2);border-color:#cbd5e1}
.btn.small{padding:8px 14px;font-size:13px;border-radius:9px}
.btn.danger{background:var(--err-bg);color:var(--err);box-shadow:none;border:1.5px solid #fecaca}
.btn.danger:hover{background:#fee2e2;transform:translateY(-1px);box-shadow:0 4px 12px -2px rgba(220,38,38,.2)}
.btn.ok{background:linear-gradient(135deg,var(--ok),#10b981);color:#fff}
.btn.ok:hover{box-shadow:0 4px 16px -2px rgba(5,150,105,.4)}

/* ========== AUTH ========== */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 700px at 15% -10%,#312e81 0%,#1e1b4b 40%,#0f172a 100%);
  position:relative;overflow:hidden}
.auth-wrap::before{content:'';position:absolute;inset:0;background:
  radial-gradient(600px 400px at 90% 100%,rgba(13,148,136,.25),transparent 60%),
  radial-gradient(500px 300px at 10% 90%,rgba(99,102,241,.2),transparent 60%);pointer-events:none}
.auth-card{position:relative;width:100%;max-width:440px;background:#fff;border-radius:24px;padding:36px 32px;box-shadow:var(--shadow-lg)}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.auth-logo .mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand-3));display:grid;place-items:center;color:#fff;font-size:21px;font-weight:900;letter-spacing:-1px;box-shadow:0 4px 14px -2px rgba(30,64,175,.5)}
.auth-logo h1{font-size:22px;letter-spacing:-.5px;font-weight:800}
.auth-sub{color:var(--muted);font-size:13.5px;margin-bottom:24px}
.tabs{display:flex;gap:4px;background:var(--bg-2);padding:4px;border-radius:12px;margin-bottom:22px}
.tabs button{flex:1;padding:9px;background:transparent;color:var(--muted);font-size:13px;border-radius:9px;font-weight:600;box-shadow:none}
.tabs button.active{background:#fff;color:var(--brand);box-shadow:var(--shadow-sm)}
.auth-foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.6}
.auth-foot code{background:var(--bg-2);padding:2px 7px;border-radius:5px;color:var(--brand);font-size:11.5px;font-weight:600}

/* ========== SHELL ========== */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-260px;z-index:60;height:100vh;transition:left .3s cubic-bezier(.4,0,.2,1);width:250px}.sidebar.open{left:0;box-shadow:var(--shadow-lg)}}
.sidebar{background:linear-gradient(180deg,#0f172a 0%,#1e1b4b 100%);color:#cbd5e1;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;color:#fff}
.sidebar .brand .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--brand-2),#22d3ee);display:grid;place-items:center;font-weight:900;font-size:17px;letter-spacing:-1px;box-shadow:0 4px 14px -2px rgba(13,148,136,.5)}
.sidebar .brand b{font-size:16px;letter-spacing:-.3px;font-weight:800}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;color:#94a3b8;font-size:14px;font-weight:600;background:transparent;text-align:left;width:100%;transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(13,148,136,.9),rgba(30,64,175,.6));color:#fff;box-shadow:0 4px 14px -2px rgba(13,148,136,.4)}
.nav-item .ic{width:20px;text-align:center;font-size:15px}
.sidebar .spacer{flex:1}
.side-user{display:flex;align-items:center;gap:10px;padding:11px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
.side-user img,.side-user .av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--brand),var(--brand-3));display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0}
.side-user .nm{font-size:13px;font-weight:700;color:#fff;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user .em{font-size:11px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{padding:28px 32px 70px;overflow-x:hidden;max-width:1400px;margin:0 auto;width:100%}
@media(max-width:720px){.main{padding:20px 16px 60px}}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.topbar h2{font-size:25px;letter-spacing:-.7px;font-weight:800}
.topbar .sub{color:var(--muted);font-size:13.5px;margin-top:3px;font-weight:500}
.burger{display:none;background:#fff;padding:10px 13px;border:1.5px solid var(--line);box-shadow:var(--shadow-sm)}
@media(max-width:900px){.burger{display:block}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm)}
.card h3{font-size:15px;margin-bottom:16px;letter-spacing:-.2px;font-weight:800}

/* ========== METRICS ========== */
.grid-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.metric{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:all .2s}
.metric:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--brand-3))}
.metric .lbl{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.metric .val{font-size:31px;font-weight:900;letter-spacing:-1.2px;margin-top:8px;color:var(--ink);line-height:1}
.metric .val.c-brand{background:linear-gradient(135deg,var(--brand),var(--brand-3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.metric .val.c-ok{color:var(--ok)}
.metric .val.c-warn{color:var(--warn)}
.metric .hint{font-size:12px;color:var(--muted);margin-top:7px;font-weight:500}

/* ========== BADGES ========== */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.2px}
.badge.ok{background:var(--ok-bg);color:#065f46}
.badge.warn{background:var(--warn-bg);color:#92400e}
.badge.err{background:var(--err-bg);color:#991b1b}
.badge.info{background:#dbeafe;color:#1e40af}
.badge.mut{background:var(--bg-2);color:#475569}

/* ========== LISTS ========== */
.list-item{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.list-item:last-child{border-bottom:none}
.list-item .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-3));flex-shrink:0}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .s{font-size:12.5px;color:var(--muted);margin-top:2px}

/* ========== QUOTE CARDS ========== */
.quote-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow-sm);transition:all .2s}
.quote-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.quote-card .info{flex:1;min-width:230px}
.quote-card .nm{font-size:16px;font-weight:800;letter-spacing:-.3px}
.quote-card .meta{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:500}
.quote-card .val{font-size:21px;font-weight:800;color:var(--ok);letter-spacing:-.6px}
.quote-card .val small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:0;margin-top:2px}
.actions{display:flex;gap:7px;flex-wrap:wrap}

/* ========== MISC ========== */
.chip{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--bg-2);font-size:11.5px;font-weight:700;color:#334155}
.toast{position:fixed;bottom:24px;right:24px;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:14px 20px;border-radius:13px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);z-index:999;animation:sl .25s ease}
@keyframes sl{from{transform:translateY(16px);opacity:0}}

/* ========== QUOTE FORM ========== */
.praca-box{background:linear-gradient(135deg,#eff6ff,#f0f9ff);border:1.5px solid #bfdbfe;border-radius:13px;padding:14px 16px;font-size:13.5px;line-height:1.55;transition:all .2s}
.praca-box b{color:var(--brand);font-weight:800}
.praca-box.warn{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fde68a}
.praca-box.warn b{color:var(--warn)}

.bracket-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:12px}
.bracket-grid .field{margin:0}
.bracket-grid input{text-align:center;font-weight:700;font-size:15px}

.ct-option{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:13px;margin-bottom:10px;cursor:pointer;transition:all .15s;background:#fff}
.ct-option:hover{border-color:#cbd5e1;background:var(--bg)}
.ct-option:has(input:checked){border-color:var(--brand);background:linear-gradient(135deg,#eff6ff,#f0f9ff);box-shadow:0 0 0 3px rgba(30,64,175,.08)}
.ct-option input{width:auto;margin:0;accent-color:var(--brand)}
.ct-option b{font-size:14px;font-weight:700}
.ct-option .desc{font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}

/* ========== PREVIEW BOX ========== */
.preview-table{width:100%;border-collapse:collapse;font-size:13.5px}
.preview-table th,.preview-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-2)}
.preview-table th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800}
.preview-table td.num,.preview-table th.num{text-align:right}
.preview-table tr:last-child td{border-bottom:none}
.preview-values{display:flex;gap:26px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:18px;border-top:1px dashed var(--line)}
.preview-values .lbl{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.preview-values .num{font-size:22px;font-weight:800;letter-spacing:-.6px;margin-top:3px}
.preview-values .num.strike{text-decoration:line-through;color:var(--muted-2);font-weight:700}
.price-pill{display:inline-flex;gap:8px;align-items:baseline;background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1.5px solid #86efac;color:#065f46;padding:8px 14px;border-radius:11px;font-size:13px;font-weight:800}

/* ============================================================
   ADMIN — GESTÃO DE TABELAS (REDESENHADO)
   ============================================================ */
.admin-shell{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
@media(max-width:960px){.admin-shell{grid-template-columns:1fr}}

/* Sidebar de filiais */
.pracas-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;position:sticky;top:20px}
@media(max-width:960px){.pracas-panel{position:static}}
.pracas-panel-head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.pracas-panel-head h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px;font-weight:800}
.search-wrap{position:relative}
.search-wrap input{padding-left:34px;font-size:13px;padding-top:9px;padding-bottom:9px}
.search-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5}

.pracas-list{max-height:calc(100vh - 260px);overflow-y:auto;padding:8px}
@media(max-width:960px){.pracas-list{max-height:340px}}
.praca-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;cursor:pointer;transition:all .15s;margin-bottom:2px;border:1.5px solid transparent}
.praca-item:hover{background:var(--bg)}
.praca-item.active{background:linear-gradient(135deg,#eff6ff,#f0f9ff);border-color:#bfdbfe}
.praca-item .dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1;flex-shrink:0;transition:all .15s}
.praca-item.active .dot{background:linear-gradient(135deg,var(--brand),var(--brand-3));box-shadow:0 0 0 3px rgba(30,64,175,.15)}
.praca-item .nm{flex:1;font-size:13.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.praca-item .base{font-size:11.5px;font-weight:800;color:var(--muted);background:var(--bg-2);padding:3px 8px;border-radius:7px;flex-shrink:0}
.praca-item.active .base{background:#dbeafe;color:var(--brand)}
.pracas-panel-foot{padding:12px 16px;border-top:1px solid var(--line);background:var(--bg-2)}

/* Editor principal */
.editor{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.editor-head{padding:22px 26px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fafbff,#f0f9ff);display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.editor-head h2{font-size:22px;letter-spacing:-.5px;font-weight:800;margin:0}
.editor-head .cities-count{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:4px}
.editor-body{padding:26px}

/* Tabs de contratação */
.ct-tabs{display:flex;gap:8px;background:var(--bg-2);padding:5px;border-radius:14px;margin-bottom:26px;flex-wrap:wrap}
.ct-tabs button{flex:1;min-width:120px;padding:11px 14px;background:transparent;color:var(--muted);font-size:13px;border-radius:10px;font-weight:700;box-shadow:none;transition:all .15s}
.ct-tabs button:hover{color:var(--ink)}
.ct-tabs button.active{background:#fff;color:var(--brand);box-shadow:var(--shadow-sm);transform:none}

/* Descontos com slider */
.discounts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:30px}
@media(max-width:720px){.discounts{grid-template-columns:1fr}}
.discount-card{background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1.5px solid #fed7aa;border-radius:15px;padding:18px 20px;position:relative;overflow:hidden}
.discount-card.geral{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-color:#bfdbfe}
.discount-card .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;color:#9a3412;margin-bottom:4px}
.discount-card.geral .label{color:#1e40af}
.discount-card .value{font-size:34px;font-weight:900;letter-spacing:-1.2px;color:#c2410c;line-height:1;margin-bottom:14px}
.discount-card.geral .value{color:var(--brand)}
.discount-card input[type=range]{width:100%;-webkit-appearance:none;height:8px;border-radius:999px;background:rgba(194,65,12,.15);outline:none;margin:6px 0 10px;padding:0;border:none}
.discount-card.geral input[type=range]{background:rgba(30,64,175,.15)}
.discount-card input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #c2410c;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer;transition:all .15s}
.discount-card input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
.discount-card.geral input[type=range]::-webkit-slider-thumb{border-color:var(--brand)}
.discount-card input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #c2410c;cursor:pointer}
.discount-card.geral input[type=range]::-moz-range-thumb{border-color:var(--brand)}
.discount-card .quick-nums{display:flex;gap:6px;flex-wrap:wrap}
.discount-card .quick-nums button{background:rgba(255,255,255,.75);border:1px solid rgba(194,65,12,.25);color:#9a3412;padding:5px 10px;border-radius:8px;font-size:11.5px;font-weight:700}
.discount-card .quick-nums button:hover{background:#fff;transform:translateY(-1px)}
.discount-card.geral .quick-nums button{border-color:rgba(30,64,175,.25);color:var(--brand)}

/* Cartões de preço por faixa */
.price-section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.price-section-head h3{font-size:14px;font-weight:800;letter-spacing:-.2px;margin:0;display:flex;align-items:center;gap:8px}
.price-section-head .adjust{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.price-section-head .adjust input{width:72px;padding:6px 8px;font-size:12.5px;text-align:center}

.price-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.price-card{background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:14px 14px 12px;transition:all .15s;position:relative}
.price-card:hover{border-color:#cbd5e1;background:#fff;box-shadow:var(--shadow-sm)}
.price-card:focus-within{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(30,64,175,.08)}
.price-card .age{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px}
.price-card .in-wrap{display:flex;align-items:baseline;gap:4px;border-bottom:2px solid transparent;transition:all .15s}
.price-card .in-wrap .rs{font-size:13px;font-weight:800;color:var(--muted)}
.price-card input[type=number]{border:none;padding:0;font-size:19px;font-weight:800;letter-spacing:-.6px;color:var(--ink);background:transparent;box-shadow:none;text-align:left;width:100%}
.price-card input[type=number]:focus{box-shadow:none}
.price-card input[type=number]::-webkit-outer-spin-button,
.price-card input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.price-card input[type=number]{-moz-appearance:textfield}
.price-card .hint{font-size:11px;color:var(--muted-2);margin-top:6px;font-weight:600}

/* Barra de ações do editor */
.editor-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:22px;border-top:1px dashed var(--line);flex-wrap:wrap}
.copy-wrap{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.copy-wrap select{width:auto;min-width:170px;padding:9px 12px;font-size:13px}
.saved-indicator{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ok);opacity:0;transition:opacity .3s}
.saved-indicator.show{opacity:1}

/* Prévia da tabela */
.mini-preview{background:linear-gradient(135deg,#fafbff,#f0f9ff);border:1.5px solid #bfdbfe;border-radius:15px;padding:18px 20px;margin-top:22px}
.mini-preview h4{font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;color:var(--brand);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.mini-preview .example{display:flex;gap:24px;flex-wrap:wrap}
.mini-preview .example .col{min-width:120px}
.mini-preview .example .col .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;color:var(--muted);margin-bottom:4px}
.mini-preview .example .col .v{font-size:17px;font-weight:800;letter-spacing:-.4px}
.mini-preview .example .col .v.strike{text-decoration:line-through;color:var(--muted-2)}
.mini-preview .example .col .v.promo{color:var(--ok)}

/* ========== PROPOSTA PÚBLICA ========== */
.pub-wrap{min-height:100vh;background:linear-gradient(180deg,#0f172a,#1e1b4b);padding:30px 16px 60px}
.pub-inner{max-width:780px;margin:0 auto}
.prop{background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg)}
.prop-head{background:linear-gradient(135deg,#1e40af,#0d9488);color:#fff;padding:28px 30px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.prop-head .logo{width:60px;height:60px;border-radius:15px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:900;font-size:24px;flex-shrink:0;overflow:hidden}
.prop-head .logo img{width:100%;height:100%;object-fit:cover}
.prop-head h3{font-size:20px;letter-spacing:-.4px;font-weight:800}
.prop-head p{font-size:12.5px;opacity:.9;margin-top:3px}
.prop-body{padding:28px 30px}
.prop-sec{margin-bottom:24px}
.prop-sec h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:7px;font-weight:800}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{font-weight:700;margin:0}
.total-box{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1.5px solid #86efac;border-radius:16px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.total-box .big{font-size:30px;font-weight:900;color:#065f46;letter-spacing:-1px}
.prop-foot{padding:20px 30px 28px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);text-align:center;line-height:1.7}
@media print{body{background:#fff}.pub-wrap{background:#fff;padding:0}.prop{box-shadow:none;border-radius:0}}
</style>
</head>
<body>

<!-- ============ AUTENTICAÇÃO ============ -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><div class="mark">C</div><h1>CotaFácil</h1></div>
    <p class="auth-sub">Cotador inteligente de planos de saúde por praça</p>

    <div class="tabs">
      <button data-tab="login" class="active">Entrar</button>
      <button data-tab="register">Criar conta</button>
      <button data-tab="recover">Recuperar</button>
    </div>

    <form id="formLogin">
      <div class="field"><label>E-mail</label><input type="email" id="liEmail" required placeholder="voce@corretora.com"></div>
      <div class="field"><label>Senha</label><input type="password" id="liPass" required placeholder="••••••"></div>
      <button class="btn" style="width:100%">Entrar</button>
      <p class="auth-foot">Demo: <code>admin@cotafacil.com</code> / <code>123456</code></p>
    </form>

    <form id="formRegister" class="hidden">
      <div class="field"><label>Nome completo</label><input id="rgName" required placeholder="João Silva"></div>
      <div class="field"><label>E-mail</label><input type="email" id="rgEmail" required placeholder="voce@corretora.com"></div>
      <div class="field"><label>Senha (mín. 4)</label><input type="password" id="rgPass" required minlength="4"></div>
      <div class="row c2">
        <div class="field"><label>WhatsApp</label><input id="rgPhone" placeholder="(11) 99999-9999"></div>
        <div class="field"><label>Corretora</label><input id="rgBroker" placeholder="Minha Corretora"></div>
      </div>
      <button class="btn" style="width:100%">Criar conta</button>
    </form>

    <form id="formRecover" class="hidden">
      <div class="field"><label>E-mail cadastrado</label><input type="email" id="rcEmail" required></div>
      <div id="rcStep2" class="hidden">
        <div class="field"><label>Nova senha</label><input type="password" id="rcPass" minlength="4"></div>
      </div>
      <button class="btn" style="width:100%" id="rcBtn">Gerar código de recuperação</button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appScreen" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="mark">C</div><b>CotaFácil</b></div>
    <button class="nav-item" data-view="dashboard"><span class="ic">📊</span> Dashboard</button>
    <button class="nav-item" data-view="quote"><span class="ic">🧮</span> Nova cotação</button>
    <button class="nav-item" data-view="proposals"><span class="ic">📄</span> Propostas</button>
    <button class="nav-item" data-view="tasks"><span class="ic">✅</span> Tarefas</button>
    <button class="nav-item" data-view="admin"><span class="ic">⚙️</span> Tabelas / Praças</button>
    <button class="nav-item" data-view="profile"><span class="ic">👤</span> Meu perfil</button>
    <div class="spacer"></div>
    <div class="side-user" id="sideUser"></div>
    <button class="nav-item" id="btnLogout" style="margin-top:6px;color:#fca5a5"><span class="ic">⏻</span> Sair</button>
  </aside>
  <main class="main" id="main"></main>
</div>

<!-- ============ PROPOSTA PÚBLICA ============ -->
<div id="publicView" class="pub-wrap hidden"><div class="pub-inner" id="publicInner"></div></div>

<script>
/* =========================================================================
   1. CONSTANTES
   ========================================================================= */
const ANS_BRACKETS = ['0 a 18','19 a 23','24 a 28','29 a 33','34 a 38','39 a 43','44 a 48','49 a 53','54 a 58','59 ou mais'];

const PRACAS = {
  'Rio de Janeiro': ['Rio de Janeiro','Niterói','Duque de Caxias','São Gonçalo','São João de Meriti','Nilópolis','Belford Roxo','Mesquita','Nova Iguaçu','Magé','Itaboraí','Maricá','Queimados'],
  'Americana': ['Americana','Artur Nogueira','Cosmópolis','Nova Odessa',"Santa Bárbara D'Oeste"],
  'Campinas': ['Campinas','Valinhos','Paulínia','Hortolândia','Jaguariúna','Pedreira','Indaiatuba','Monte Mor','Holambra','Sumaré','Elias Fausto','Santo Antônio de Posse','Amparo'],
  'Jundiaí': ['Jundiaí','Várzea Paulista','Louveira','Itupeva','Cajamar','Vinhedo','Itatiba'],
  'Mogi das Cruzes': ['Mogi das Cruzes','Suzano','Poá','Itaquaquecetuba','Ferraz de Vasconcelos','Arujá','Guararema','Santa Isabel'],
  'Santos': ['Santos','São Vicente','Praia Grande','Guarujá','Cubatão','Bertioga','Mongaguá'],
  'São Bernardo do Campo': ['São Bernardo do Campo','Santo André','Diadema','São Caetano do Sul','Mauá','Ribeirão Pires','Rio Grande da Serra','Embu-Guaçu'],
  'São Paulo': ['São Paulo','Taboão da Serra','Carapicuíba','Guarulhos','Caieiras','Embu das Artes','Barueri','Osasco','Mairiporã','Jandira','Franco da Rocha','Itapecerica da Serra','Cotia','Itapevi'],
  'Sorocaba': ['Sorocaba','Votorantim','Araçoiaba da Serra','Salto de Pirapora','Alumínio','Piedade','Capela do Alto','Ibiúna','Iperó','São Roque','Porto Feliz','Salto','Itu','Cabreúva','Sarapuí','Araçariguama']
};

const CONTRACT_TYPES = [
  { id:'PF',  label:'Pessoa Física (PF)',        desc:'Titular e dependentes' },
  { id:'MEI', label:'Super Simples / MEI',       desc:'2 a 29 vidas' },
  { id:'PJ',  label:'PJ',                        desc:'30+ vidas' }
];

const CEP_MAP = [
  { praca:'Americana',              from:13460000, to:13479999 },
  { praca:'Jundiaí',                from:13200000, to:13299999 },
  { praca:'Campinas',               from:13000000, to:13199999 },
  { praca:'Campinas',               from:13300000, to:13399999 },
  { praca:'Mogi das Cruzes',        from:8500000,  to:8999999  },
  { praca:'São Bernardo do Campo',  from:9000000,  to:9999999  },
  { praca:'Santos',                 from:11000000, to:11999999 },
  { praca:'Sorocaba',               from:18000000, to:18599999 },
  { praca:'São Paulo',              from:1000000,  to:5999999  },
  { praca:'São Paulo',              from:6000000,  to:6999999  },
  { praca:'São Paulo',              from:7000000,  to:7999999  },
  { praca:'São Paulo',              from:8000000,  to:8499999  },
  { praca:'Rio de Janeiro',         from:20000000, to:28999999 }
];

const BASE_PF = {
  'Rio de Janeiro':215,'Americana':175,'Campinas':190,'Jundiaí':195,'Mogi das Cruzes':170,
  'Santos':185,'São Bernardo do Campo':180,'São Paulo':230,'Sorocaba':165
};
const AGE_FACTORS = [1,1.12,1.26,1.42,1.60,1.82,2.08,2.38,2.72,3.15];
const FIRST_MONTH_DISC = {
  'São Paulo':75,'Rio de Janeiro':60,'Campinas':50,'Jundiaí':45,
  'São Bernardo do Campo':50,'Santos':40,'Mogi das Cruzes':35,'Sorocaba':40,'Americana':35
};
const TYPE_FACTOR = { PF:1, MEI:0.82, PJ:0.70 };

/* =========================================================================
   2. PERSISTÊNCIA
   ========================================================================= */
const KEY = 'cotafacil.v2';
let DB = null;
let STATE = { view:'dashboard', selPraca:null, adminCT:'PF' };

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function money(n){ return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function buildDefaultTables(){
  const t = {};
  for (const praca of Object.keys(PRACAS)) {
    t[praca] = {};
    for (const ct of ['PF','MEI','PJ']) {
      const base = (BASE_PF[praca]||180) * TYPE_FACTOR[ct];
      const fd = ct === 'PF' ? (FIRST_MONTH_DISC[praca]||0) : Math.round((FIRST_MONTH_DISC[praca]||0)/2);
      t[praca][ct] = {
        prices: AGE_FACTORS.map(f => Math.round(base * f * 100)/100),
        discount: { firstMonth: fd, general: 0 }
      };
    }
  }
  return t;
}
function seed(){
  return {
    users: [{
      id:'admin', email:'admin@cotafacil.com', pass:'123456', role:'admin',
      name:'Administrador', phone:'(11) 99999-0000', social:'@cotafacil',
      brokerage:'CotaFácil Corretora', logo:'', photo:''
    }],
    session: null, quotes: [], tables: buildDefaultTables(),
    pracas: JSON.parse(JSON.stringify(PRACAS)),
    tasks: [{ id:uid(), text:'Revisar tabela de São Paulo (75% 1º mês)', done:false, due:new Date().toISOString().slice(0,10) }],
    notifications: []
  };
}
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) { DB = seed(); save(); return; }
    DB = JSON.parse(raw);
    if (!DB.tables) DB.tables = buildDefaultTables();
    if (!DB.pracas) DB.pracas = JSON.parse(JSON.stringify(PRACAS));
  } catch(e){ DB = seed(); save(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
function currentUser(){ return DB.users.find(u => u.id === DB.session) || null; }
function notify(text){ DB.notifications.unshift({ id:uid(), text, at:new Date().toISOString() }); DB.notifications = DB.notifications.slice(0,40); }

/* =========================================================================
   3. MOTOR DE MAPEAMENTO E CÁLCULO
   ========================================================================= */
function norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }

function resolvePraca(city, cep){
  const n = norm(city);
  if (!n) return null;
  for (const [praca, cities] of Object.entries(DB.pracas)) {
    if (norm(praca) === n) return { praca, match:'exata', detail:'Nome da filial' };
    for (const c of cities) if (norm(c) === n) return { praca, match:'exata', detail:'Cidade cadastrada' };
  }
  for (const [praca, cities] of Object.entries(DB.pracas)) {
    for (const c of cities) {
      const nc = norm(c);
      if (nc.includes(n) || n.includes(nc)) return { praca, match:'aproximada', detail:'Cidade "'+c+'"' };
    }
  }
  const digits = (cep||'').replace(/\D/g,'');
  if (digits.length >= 8) {
    const num = parseInt(digits.slice(0,8),10);
    const hit = CEP_MAP.find(r => num >= r.from && num <= r.to);
    if (hit && DB.tables[hit.praca]) return { praca:hit.praca, match:'regional', detail:'Faixa de CEP '+digits.slice(0,5)+'-'+digits.slice(5) };
  }
  return null;
}

function calc(table, lives){
  let base = 0; const detail = [];
  lives.forEach((q,i) => {
    const qty = Number(q)||0;
    if (qty > 0) {
      const unit = Number(table.prices[i])||0;
      const sub = unit * qty;
      base += sub;
      detail.push({ faixa: ANS_BRACKETS[i], qty, unit, sub });
    }
  });
  const fd = Number(table.discount.firstMonth)||0;
  const gd = Number(table.discount.general)||0;
  const afterGeneral = base * (1 - gd/100);
  const first = afterGeneral * (1 - fd/100);
  return { base, detail, afterGeneral, first, fd, gd, totalLives: lives.reduce((a,b)=>a+(Number(b)||0),0) };
}

/* =========================================================================
   4. AUTENTICAÇÃO
   ========================================================================= */
function showAuth(){ document.getElementById('authScreen').classList.remove('hidden'); document.getElementById('appScreen').classList.add('hidden'); document.getElementById('publicView').classList.add('hidden'); }
function showApp(){ document.getElementById('authScreen').classList.add('hidden'); document.getElementById('appScreen').classList.remove('hidden'); document.getElementById('publicView').classList.add('hidden'); renderSideUser(); renderView(); }

document.querySelectorAll('.tabs button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    ['login','register','recover'].forEach(t => {
      document.getElementById('form' + t[0].toUpperCase() + t.slice(1)).classList.toggle('hidden', t !== b.dataset.tab);
    });
  };
});

document.getElementById('formLogin').onsubmit = e => {
  e.preventDefault();
  const email = document.getElementById('liEmail').value.trim().toLowerCase();
  const pass = document.getElementById('liPass').value;
  const u = DB.users.find(x => x.email.toLowerCase() === email && x.pass === pass);
  if (!u) return toast('E-mail ou senha inválidos');
  DB.session = u.id; save(); showApp(); toast('Bem-vindo, ' + u.name.split(' ')[0] + '!');
};

document.getElementById('formRegister').onsubmit = e => {
  e.preventDefault();
  const email = document.getElementById('rgEmail').value.trim().toLowerCase();
  if (DB.users.some(x => x.email.toLowerCase() === email)) return toast('E-mail já cadastrado');
  const u = { id:uid(), role:'admin', name:document.getElementById('rgName').value.trim(), email, pass:document.getElementById('rgPass').value, phone:document.getElementById('rgPhone').value.trim(), brokerage:document.getElementById('rgBroker').value.trim() || 'Minha Corretora', social:'', logo:'', photo:'' };
  DB.users.push(u); DB.session = u.id; save(); showApp(); toast('Conta criada com sucesso!');
};

let rcStage = 0;
document.getElementById('rcBtn').onclick = e => {
  e.preventDefault();
  const email = document.getElementById('rcEmail').value.trim().toLowerCase();
  const u = DB.users.find(x => x.email.toLowerCase() === email);
  if (!u) return toast('E-mail não encontrado');
  if (rcStage === 0) {
    rcStage = 1;
    document.getElementById('rcStep2').classList.remove('hidden');
    document.getElementById('rcBtn').textContent = 'Redefinir senha';
    document.getElementById('rcPass').required = true;
    toast('Identidade confirmada. Defina a nova senha.');
  } else {
    u.pass = document.getElementById('rcPass').value;
    save(); rcStage = 0;
    document.getElementById('rcStep2').classList.add('hidden');
    document.getElementById('rcBtn').textContent = 'Gerar código de recuperação';
    document.getElementById('rcPass').required = false;
    toast('Senha redefinida! Faça login.');
    document.querySelector('.tabs button[data-tab="login"]').click();
  }
};

document.getElementById('btnLogout').onclick = () => { DB.session = null; save(); showAuth(); };

/* =========================================================================
   5. NAVEGAÇÃO
   ========================================================================= */
function renderSideUser(){
  const u = currentUser(); if (!u) return;
  const initials = u.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('sideUser').innerHTML = `
    ${u.photo ? `<img src="${esc(u.photo)}" alt="">` : `<div class="av">${initials}</div>`}
    <div style="min-width:0"><div class="nm">${esc(u.name)}</div><div class="em">${esc(u.brokerage||'')}</div></div>`;
}

document.querySelectorAll('.nav-item[data-view]').forEach(b => {
  b.onclick = () => { STATE.view = b.dataset.view; renderView(); document.getElementById('sidebar').classList.remove('open'); };
});

function setActiveNav(){ document.querySelectorAll('.nav-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === STATE.view)); }

function renderView(){
  setActiveNav();
  const map = { dashboard:viewDashboard, quote:viewQuote, proposals:viewProposals, tasks:viewTasks, admin:viewAdmin, profile:viewProfile };
  (map[STATE.view] || viewDashboard)();
  window.scrollTo(0,0);
}

/* =========================================================================
   6. DASHBOARD
   ========================================================================= */
function myQuotes(){ return DB.quotes.filter(q => q.userId === DB.session); }

function viewDashboard(){
  const qs = myQuotes();
  const sent = qs.length, closed = qs.filter(q => q.status === 'fechado').length;
  const opens = qs.reduce((a,q) => a + (q.opens||0), 0);
  const openRate = sent ? Math.round((opens / sent) * 100) : 0;
  const u = currentUser();

  document.getElementById('main').innerHTML = `
    <div class="topbar">
      <button class="burger btn ghost small" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div><h2>Olá, ${esc(u.name.split(' ')[0])} 👋</h2><div class="sub">${esc(u.brokerage)} · Painel de cotações</div></div>
    </div>

    <div class="grid-metrics">
      <div class="metric"><div class="lbl">Cotações enviadas</div><div class="val c-brand">${sent}</div><div class="hint">Total no seu histórico</div></div>
      <div class="metric"><div class="lbl">Propostas fechadas</div><div class="val c-ok">${closed}</div><div class="hint">${sent?Math.round(closed/sent*100):0}% de conversão</div></div>
      <div class="metric"><div class="lbl">Taxa de abertura</div><div class="val c-warn">${openRate}%</div><div class="hint">${opens} abertura(s)</div></div>
      <div class="metric"><div class="lbl">Tarefas pendentes</div><div class="val">${DB.tasks.filter(t=>!t.done).length}</div><div class="hint">Lembretes ativos</div></div>
    </div>

    <div class="row c2">
      <div class="card">
        <h3>🔔 Notificações</h3>
        <div>${DB.notifications.length ? DB.notifications.slice(0,6).map(n => `
          <div class="list-item"><div class="dot"></div><div class="grow">
            <div class="t" style="font-weight:600;font-size:13.5px">${esc(n.text)}</div>
            <div class="s">${new Date(n.at).toLocaleString('pt-BR')}</div>
          </div></div>`).join('') : `<p style="color:var(--muted);font-size:13.5px">Nenhuma notificação.</p>`}</div>
      </div>

      <div class="card">
        <h3>🔎 Buscador de clientes</h3>
        <input id="dashSearch" placeholder="Nome, CPF/CNPJ, praça ou data" style="margin-bottom:12px">
        <div id="dashResults"><p style="color:var(--muted);font-size:13.5px">Digite para buscar…</p></div>
      </div>
    </div>`;

  document.getElementById('dashSearch').oninput = e => {
    const term = norm(e.target.value);
    const box = document.getElementById('dashResults');
    if (!term) { box.innerHTML = '<p style="color:var(--muted);font-size:13.5px">Digite para buscar…</p>'; return; }
    const res = myQuotes().filter(q => norm(q.clientName).includes(term) || norm(q.clientDoc).includes(term) || norm(q.praca).includes(term) || (q.createdAt||'').includes(term)).slice(0,8);
    box.innerHTML = res.length ? res.map(q => `
      <div class="list-item"><div class="dot"></div><div class="grow">
        <div class="t">${esc(q.clientName)}</div>
        <div class="s">${esc(q.praca)} · ${new Date(q.createdAt).toLocaleDateString('pt-BR')} · ${money(q.first)}</div>
      </div></div>`).join('') : '<p style="color:var(--muted);font-size:13.5px">Nenhum resultado.</p>';
  };
}

/* =========================================================================
   7. NOVA COTAÇÃO
   ========================================================================= */
function allCities(){ const set = new Set(); Object.values(DB.pracas).forEach(arr => arr.forEach(c => set.add(c))); return [...set].sort((a,b)=>a.localeCompare(b,'pt-BR')); }

function viewQuote(){
  const pracaOpts = Object.keys(DB.tables).map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');

  document.getElementById('main').innerHTML = `
    <div class="topbar">
      <button class="burger btn ghost small" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div><h2>Nova cotação</h2><div class="sub">Mapeamento automático de cidade → praça</div></div>
    </div>

    <div class="row c2">
      <div class="card">
        <h3>Dados do cliente</h3>
        <div class="field"><label>Nome / Razão social</label><input id="qName" placeholder="Ex: Maria Souza"></div>
        <div class="row c2">
          <div class="field"><label>CPF / CNPJ</label><input id="qDoc" placeholder="000.000.000-00"></div>
          <div class="field"><label>Tipo de cliente</label><select id="qClientType"><option value="PF">Pessoa Física</option><option value="PJ">Pessoa Jurídica</option></select></div>
        </div>
        <div class="row c2">
          <div class="field"><label>Cidade</label><input id="qCity" list="cityList" placeholder="Digite a cidade"><datalist id="cityList">${allCities().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
          <div class="field"><label>CEP (opcional)</label><input id="qCep" placeholder="00000-000"></div>
        </div>
        <div id="pracaBox" class="praca-box">Digite a cidade para identificar a praça automaticamente.</div>
      </div>

      <div class="card">
        <h3>Tipo de contratação</h3>
        <div id="ctList">
          ${CONTRACT_TYPES.map((c,i) => `
            <label class="ct-option">
              <input type="radio" name="ct" value="${c.id}" ${i===0?'checked':''}>
              <div><b>${c.label}</b><div class="desc">${c.desc}</div></div>
            </label>`).join('')}
        </div>
        <div class="field" style="margin-top:15px">
          <label>Forçar praça manualmente (opcional)</label>
          <select id="qPracaManual"><option value="">— Automático —</option>${pracaOpts}</select>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <h3>Distribuição de vidas por faixa etária (ANS)</h3>
      <div class="bracket-grid" id="bracketGrid">
        ${ANS_BRACKETS.map((b,i)=>`<div class="field"><label>${b}</label><input type="number" min="0" value="0" data-i="${i}" class="lifeIn"></div>`).join('')}
      </div>
      <div style="display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap">
        <span class="chip">Total de vidas: <b id="totalLives">0</b></span>
        <span id="ctWarn" class="badge warn hidden"></span>
      </div>
    </div>

    <div class="card" style="margin-top:16px" id="previewCard">
      <h3>Prévia do cálculo</h3>
      <p style="color:var(--muted);font-size:13.5px">Informe a cidade e as vidas para visualizar os valores.</p>
    </div>

    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      <button class="btn" id="btnGerar">💾 Gerar proposta</button>
      <button class="btn ghost" id="btnLimpar">Limpar</button>
    </div>`;

  const cityEl = document.getElementById('qCity');
  const cepEl  = document.getElementById('qCep');
  const box    = document.getElementById('pracaBox');
  const manual = document.getElementById('qPracaManual');

  function updatePraca(){
    const forced = manual.value;
    STATE.detected = forced ? { praca:forced, match:'manual', detail:'Seleção manual' } : resolvePraca(cityEl.value, cepEl.value);
    if (!STATE.detected) {
      box.className = 'praca-box warn';
      box.innerHTML = `⚠️ Cidade não mapeada. Selecione a praça manualmente ou informe o CEP.`;
    } else {
      const d = STATE.detected;
      box.className = 'praca-box';
      const tag = d.match === 'exata' ? 'ok' : d.match === 'regional' ? 'info' : 'warn';
      box.innerHTML = `📍 Praça identificada: <b>${esc(d.praca)}</b> <span class="badge ${tag}" style="margin-left:6px">${d.match === 'exata' ? 'exata' : d.match === 'regional' ? 'regional por CEP' : d.match === 'manual' ? 'manual' : 'aproximada'}</span><div style="font-size:12.5px;color:var(--muted);margin-top:5px">${esc(d.detail)}</div>`;
    }
    updatePreview();
  }

  cityEl.oninput = updatePraca;
  cepEl.oninput  = updatePraca;
  manual.onchange = updatePraca;

  function readLives(){ return [...document.querySelectorAll('.lifeIn')].map(i => Number(i.value)||0); }
  function readCT(){ return document.querySelector('input[name=ct]:checked').value; }

  function updatePreview(){
    const lives = readLives();
    const total = lives.reduce((a,b)=>a+b,0);
    document.getElementById('totalLives').textContent = total;

    const ct = readCT();
    const warn = document.getElementById('ctWarn');
    if (ct === 'MEI' && total > 0 && (total < 2 || total > 29)) { warn.textContent = 'MEI: 2 a 29 vidas'; warn.classList.remove('hidden'); }
    else if (ct === 'PJ' && total > 0 && total < 30) { warn.textContent = 'PJ: a partir de 30 vidas'; warn.classList.remove('hidden'); }
    else warn.classList.add('hidden');

    const card = document.getElementById('previewCard');
    if (!STATE.detected || !total) { card.innerHTML = '<h3>Prévia do cálculo</h3><p style="color:var(--muted);font-size:13.5px">Informe a cidade e as vidas.</p>'; return; }

    const table = DB.tables[STATE.detected.praca][ct];
    const c = calc(table, lives);

    card.innerHTML = `
      <h3>Prévia do cálculo — ${esc(STATE.detected.praca)} · ${ct}</h3>
      <table class="preview-table">
        <thead><tr><th>Faixa etária</th><th class="num">Vidas</th><th class="num">Unitário</th><th class="num">Subtotal</th></tr></thead>
        <tbody>${c.detail.map(d => `<tr><td>${d.faixa}</td><td class="num">${d.qty}</td><td class="num">${money(d.unit)}</td><td class="num"><b>${money(d.sub)}</b></td></tr>`).join('')}</tbody>
      </table>
      <div class="preview-values">
        <div><div class="lbl">Valor original</div><div class="num ${c.fd?'strike':''}">${money(c.base)}</div></div>
        <div><div class="lbl">A partir do 2º mês</div><div class="num">${money(c.afterGeneral)}</div></div>
        ${c.fd ? `<div class="price-pill">🔥 1º mês com ${c.fd}% off: ${money(c.first)}</div>` : ''}
      </div>`;
  }

  document.querySelectorAll('.lifeIn').forEach(inp => inp.oninput = updatePreview);
  document.querySelectorAll('input[name=ct]').forEach(r => r.onchange = updatePreview);

  document.getElementById('btnGerar').onclick = () => {
    const name = document.getElementById('qName').value.trim();
    if (!name) return toast('Informe o nome do cliente');
    if (!STATE.detected) return toast('Praça não identificada');
    const lives = readLives();
    if (!lives.reduce((a,b)=>a+b,0)) return toast('Adicione ao menos uma vida');

    const ct = readCT();
    const table = DB.tables[STATE.detected.praca][ct];
    const c = calc(table, lives);

    DB.quotes.unshift({
      id:uid(), userId:DB.session, createdAt:new Date().toISOString(),
      clientName:name, clientDoc:document.getElementById('qDoc').value.trim(),
      clientType:document.getElementById('qClientType').value,
      city:cityEl.value.trim(), cep:cepEl.value.trim(),
      praca:STATE.detected.praca, pracaMatch:STATE.detected.match,
      contractType:ct, lives, detail:c.detail, totalLives:c.totalLives,
      base:c.base, afterGeneral:c.afterGeneral, first:c.first, fd:c.fd, gd:c.gd,
      status:'enviado', opens:0
    });
    notify('Cotação gerada para ' + name);
    save(); toast('Proposta gerada!');
    STATE.view = 'proposals'; renderView();
  };
  document.getElementById('btnLimpar').onclick = () => { STATE.view = 'quote'; renderView(); };

  updatePraca();
}

function getQuote(id){ return DB.quotes.find(q => q.id === id); }
function toggleClosed(id){ const q = getQuote(id); if (!q) return; q.status = q.status === 'fechado' ? 'enviado' : 'fechado'; if (q.status === 'fechado') notify('Proposta fechada: ' + q.clientName); save(); renderView(); toast('Status atualizado'); }
function delQuote(id){ if (!confirm('Excluir esta proposta?')) return; DB.quotes = DB.quotes.filter(q => q.id !== id); save(); renderView(); toast('Excluída'); }

function shareLink(q){ const payload = btoa(encodeURIComponent(JSON.stringify({ q, u: (DB.users.find(u=>u.id===q.userId)||{}) }))); return location.href.split('#')[0] + '#p=' + payload; }
function copyLink(id){ navigator.clipboard.writeText(shareLink(getQuote(id))).then(()=>toast('Link copiado!')).catch(()=>toast('Não foi possível copiar')); }
function shareWhats(id){
  const q = getQuote(id); const u = DB.users.find(x => x.id === q.userId) || {};

  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

          </div>

          <!-- Prévia em tempo real -->
          <div class="mini-preview" id="miniPreview"></div>

          <!-- Ações finais -->
          <div class="editor-actions">
            <div class="copy-wrap">
              📋 Copiar preços de:
              <select id="copyFrom">
                <option value="">Selecione…</option>
                ${pracas.filter(x => x !== p).map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join('')}
              </select>
              <button class="btn small ghost" onclick="adminCopyFrom()">Copiar</button>
            </div>
            <div style="display:flex;align-items:center;gap:12px">
              <span class="saved-indicator" id="savedInd">✓ Salvo</span>
              <button class="btn" onclick="adminSave()">💾 Salvar alterações</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;

  // --- Bindings
  document.querySelectorAll('.praca-item').forEach(el => {
    el.onclick = () => { STATE.selPraca = el.dataset.praca; renderView(); };
  });

  const searchEl = document.getElementById('pracaSearch');
  searchEl.oninput = e => {
    const term = norm(e.target.value);
    document.querySelectorAll('.praca-item').forEach(el => {
      el.style.display = norm(el.dataset.praca).includes(term) ? '' : 'none';
    });
  };

  const dFirstRange = document.getElementById('dFirstRange');
  const dGenRange = document.getElementById('dGenRange');
  const dFirstVal = document.getElementById('dFirstVal');
  const dGenVal = document.getElementById('dGenVal');

  dFirstRange.oninput = () => { dFirstVal.textContent = dFirstRange.value + '%'; updateMiniPreview(); };
  dGenRange.oninput   = () => { dGenVal.textContent   = dGenRange.value   + '%'; updateMiniPreview(); };

  document.querySelectorAll('.price-input').forEach(inp => {
    inp.oninput = updateMiniPreview;
    inp.onblur = updateMiniPreview;
  });

  updateMiniPreview();
}

function adminSetCT(ct){ STATE.adminCT = ct; renderView(); }
function adminQuickDisc(kind, val){
  if (kind === 'first') { document.getElementById('dFirstRange').value = val; document.getElementById('dFirstVal').textContent = val+'%'; }
  else { document.getElementById('dGenRange').value = val; document.getElementById('dGenVal').textContent = val+'%'; }
  updateMiniPreview();
}

function updateMiniPreview(){
  const box = document.getElementById('miniPreview');
  if (!box) return;
  const p = STATE.selPraca, ct = STATE.adminCT || 'PF';
  const prices = [...document.querySelectorAll('.price-input')].map(i => Number(i.value)||0);
  const fd = Number(document.getElementById('dFirstRange').value)||0;
  const gd = Number(document.getElementById('dGenRange').value)||0;

  // exemplo: 1 vida na faixa 34-38 (índice 4)
  const idx = 4;
  const unit = prices[idx];
  const afterGen = unit * (1 - gd/100);
  const firstMonth = afterGen * (1 - fd/100);

  box.innerHTML = `
    <h4>💡 Prévia em tempo real — ${esc(p)} · ${ct}</h4>
    <div class="example">
      <div class="col"><div class="k">Exemplo: 1 vida 34-38</div><div class="v">${money(unit)}</div></div>
      <div class="col"><div class="k">Original mensal</div><div class="v ${fd||gd?'strike':''}">${money(unit)}</div></div>
      <div class="col"><div class="k">2º mês em diante</div><div class="v">${money(afterGen)}</div></div>
      ${fd ? `<div class="col"><div class="k">1º mês (${fd}% off)</div><div class="v promo">${money(firstMonth)}</div></div>` : ''}
    </div>`;
}

function adminBulkAdjust(){
  const pct = Number(document.getElementById('bulkPct').value);
  if (!pct || isNaN(pct)) return toast('Informe um percentual');
  document.querySelectorAll('.price-input').forEach(inp => {
    const v = Number(inp.value)||0;
    inp.value = (v * (1 + pct/100)).toFixed(2);
  });
  updateMiniPreview();
  toast(`Ajuste de ${pct>0?'+':''}${pct}% aplicado`);
}

function adminCopyFrom(){
  const from = document.getElementById('copyFrom').value;
  if (!from) return toast('Selecione uma filial de origem');
  const p = STATE.selPraca, ct = STATE.adminCT || 'PF';
  const source = DB.tables[from][ct];
  if (!source) return toast('Sem dados nessa filial/tipo');
  // copia valores para os inputs
  const inputs = document.querySelectorAll('.price-input');
  inputs.forEach((inp, i) => { inp.value = source.prices[i].toFixed(2); });
  // copia também os descontos
  document.getElementById('dFirstRange').value = source.discount.firstMonth;
  document.getElementById('dFirstVal').textContent = source.discount.firstMonth + '%';
  document.getElementById('dGenRange').value = source.discount.general;
  document.getElementById('dGenVal').textContent = source.discount.general + '%';
  updateMiniPreview();
  toast(`Preços e descontos de "${from}" (${ct}) carregados`);
}

function adminSave(){
  const p = STATE.selPraca, ct = STATE.adminCT || 'PF';
  const prices = [...document.querySelectorAll('.price-input')].map(i => Number(i.value)||0);
  DB.tables[p][ct] = {
    prices,
    discount: {
      firstMonth: Number(document.getElementById('dFirstRange').value)||0,
      general: Number(document.getElementById('dGenRange').value)||0
    }
  };
  save();
  const ind = document.getElementById('savedInd');
  if (ind) { ind.classList.add('show'); setTimeout(()=>ind.classList.remove('show'), 2000); }
  notify('Tabela salva: ' + p + ' / ' + ct);
  toast('Tabela salva com sucesso');
  // atualiza base do sidebar
  const item = [...document.querySelectorAll('.praca-item')].find(el => el.dataset.praca === p);
  if (item) item.querySelector('.base').textContent = money(DB.tables[p].PF.prices[0]);
}

function editCities(p){
  const atual = (DB.pracas[p]||[]).join(', ');
  const novo = prompt('Cidades da praça ' + p + ' (separadas por vírgula):', atual);
  if (novo === null) return;
  DB.pracas[p] = novo.split(',').map(s=>s.trim()).filter(Boolean);
  save(); renderView(); toast('Cidades atualizadas');
}

function addPraca(){
  const nome = prompt('Nome da nova praça (filial):');
  if (!nome) return;
  if (DB.tables[nome]) return toast('Praça já existe');
  DB.tables[nome] = {
    PF:  { prices: AGE_FACTORS.map(f => Math.round(180*f*100)/100), discount:{firstMonth:0,general:0} },
    MEI: { prices: AGE_FACTORS.map(f => Math.round(180*0.82*f*100)/100), discount:{firstMonth:0,general:0} },
    PJ:  { prices: AGE_FACTORS.map(f => Math.round(180*0.70*f*100)/100), discount:{firstMonth:0,general:0} }
  };
  DB.pracas[nome] = [];
  STATE.selPraca = nome; save(); renderView(); toast('Praça criada');
}

function delPraca(p){
  if (Object.keys(DB.tables).length <= 1) return toast('É preciso manter ao menos uma praça');
  if (!confirm('Remover a praça "' + p + '" e suas tabelas?')) return;
  delete DB.tables[p]; delete DB.pracas[p];
  STATE.selPraca = Object.keys(DB.tables)[0];
  save(); renderView(); toast('Praça removida');
}

/* =========================================================================
   11. PERFIL
   ========================================================================= */
function viewProfile(){
  const u = currentUser();
  const initials = u.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('main').innerHTML = `
    <div class="topbar">
      <button class="burger btn ghost small" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div><h2>Meu perfil</h2><div class="sub">Dados integrados automaticamente às propostas</div></div>
    </div>
    <div class="card" style="max-width:720px">
      <div style="display:flex;gap:18px;align-items:center;margin-bottom:24px;flex-wrap:wrap">
        ${u.photo ? `<img src="${esc(u.photo)}" style="width:78px;height:78px;border-radius:50%;object-fit:cover">`
                  : `<div style="width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-3));color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800">${initials}</div>`}
        <div><div style="font-weight:800;font-size:18px">${esc(u.name)}</div><div style="color:var(--muted);font-size:13.5px">${esc(u.email)}</div></div>
      </div>
      <div class="row c2">
        <div class="field"><label>Nome</label><input id="pfName" value="${esc(u.name)}"></div>
        <div class="field"><label>WhatsApp / Telefone</label><input id="pfPhone" value="${esc(u.phone||'')}" placeholder="(11) 99999-9999"></div>
      </div>
      <div class="row c2">
        <div class="field"><label>Nome da corretora</label><input id="pfBroker" value="${esc(u.brokerage||'')}"></div>
        <div class="field"><label>Redes sociais</label><input id="pfSocial" value="${esc(u.social||'')}" placeholder="@suacorretora"></div>
      </div>
      <div class="field"><label>URL da foto</label><input id="pfPhoto" value="${esc(u.photo||'')}" placeholder="https://..."></div>
      <div class="field"><label>URL do logo da corretora</label><input id="pfLogo" value="${esc(u.logo||'')}" placeholder="https://..."></div>
      <button class="btn" id="btnSaveProfile">💾 Salvar perfil</button>
    </div>`;

  document.getElementById('btnSaveProfile').onclick = () => {
    u.name = document.getElementById('pfName').value.trim() || u.name;
    u.phone = document.getElementById('pfPhone').value.trim();
    u.brokerage = document.getElementById('pfBroker').value.trim();
    u.social = document.getElementById('pfSocial').value.trim();
    u.photo = document.getElementById('pfPhoto').value.trim();
    u.logo = document.getElementById('pfLogo').value.trim();
    save(); renderSideUser(); renderView(); toast('Perfil atualizado');
  };
}

/* =========================================================================
   12. PROPOSTA PÚBLICA
   ========================================================================= */
function renderPublic(){
  const raw = location.hash.slice(3);
  let data;
  try { data = JSON.parse(decodeURIComponent(atob(raw))); }
  catch(e){ document.getElementById('publicInner').innerHTML = '<div class="prop"><div class="prop-body"><h3>Link inválido</h3></div></div>'; document.getElementById('publicView').classList.remove('hidden'); document.getElementById('authScreen').classList.add('hidden'); return; }
  const { q, u } = data;
  const local = DB.quotes.find(x => x.id === q.id);
  if (local) { local.opens = (local.opens||0) + 1; save(); }
  document.getElementById('publicInner').innerHTML = `<div class="prop">${proposalBody(q, u || {})}</div><div style="text-align:center;margin-top:22px;color:#94a3b8;font-size:12.5px">Proposta gerada por <b style="color:#e2e8f0">CotaFácil</b></div>`;
  document.getElementById('publicView').classList.remove('hidden');
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.add('hidden');
}

/* =========================================================================
   13. UTIL
   ========================================================================= */
let toastTimer = null;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.remove(), 2800);
}

/* =========================================================================
   14. BOOT
   ========================================================================= */
load();
if (location.hash.startsWith('#p=')) renderPublic();
else if (DB.session && currentUser()) showApp();
else showAuth();

window.addEventListener('hashchange', () => {
  if (location.hash.startsWith('#p=')) renderPublic();
  else if (DB.session && currentUser()) showApp();
  else showAuth();
});
</script>
</body>
