<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CotaFácil — Cotador de Planos de Saúde</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#0b4f9e; --brand-2:#0e7490; --accent:#f59e0b;
  --bg:#f1f5f9; --card:#fff; --line:#e2e8f0; --text:#0f172a; --muted:#64748b;
  --ok:#059669; --warn:#d97706; --err:#dc2626; --radius:14px;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:600;font-size:14px;transition:.15s}
button:active{transform:scale(.98)}
.btn{padding:11px 18px;background:var(--brand);color:#fff}
.btn:hover{background:#0a4485}
.btn.ghost{background:#eef2f7;color:var(--text)}
.btn.ghost:hover{background:#e2e8f0}
.btn.small{padding:7px 12px;font-size:13px}
.btn.danger{background:#fee2e2;color:var(--err)}
.btn.ok{background:var(--ok);color:#fff}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;background:#fff;color:var(--text);outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,79,158,.1)}
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.field{margin-bottom:14px}
.row{display:grid;gap:14px}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:720px){.row.c2,.row.c3{grid-template-columns:1fr}}

/* ---------- AUTH ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 600px at 10% -10%,#1e5fae 0%,#0b2b52 45%,#071a33 100%)}
.auth-card{width:100%;max-width:430px;background:#fff;border-radius:20px;padding:34px 30px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.auth-logo .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800}
.auth-logo h1{font-size:21px;letter-spacing:-.4px}
.auth-sub{color:var(--muted);font-size:13.5px;margin-bottom:22px}
.tabs{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:12px;margin-bottom:20px}
.tabs button{flex:1;padding:9px;background:transparent;color:var(--muted);font-size:13px;border-radius:9px}
.tabs button.active{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.09)}
.auth-foot{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}
.auth-foot code{background:#f1f5f9;padding:2px 6px;border-radius:5px;color:var(--brand);font-size:11.5px}

/* ---------- APP SHELL ---------- */
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-250px;z-index:60;height:100vh;transition:.25s}.sidebar.open{left:0}}
.sidebar{background:#0b2b52;color:#cbd8e8;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.sidebar .brand{display:flex;align-items:center;gap:9px;padding:0 8px 18px;color:#fff}
.sidebar .brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand-2),#22d3ee);display:grid;place-items:center;font-weight:800;font-size:16px}
.sidebar .brand b{font-size:16px;letter-spacing:-.3px}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;color:#cbd8e8;font-size:14px;font-weight:600;background:transparent;text-align:left;width:100%}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(14,116,144,.85),rgba(11,79,158,.55));color:#fff}
.nav-item .ic{width:20px;text-align:center;font-size:15px}
.sidebar .spacer{flex:1}
.side-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;background:rgba(255,255,255,.06)}
.side-user img,.side-user .av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#1e5fae;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0}
.side-user .nm{font-size:13px;font-weight:700;color:#fff;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user .em{font-size:11px;color:#8fa6c4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{padding:26px 30px 60px;overflow-x:hidden}
@media(max-width:720px){.main{padding:18px 16px 60px}}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.topbar h2{font-size:23px;letter-spacing:-.5px}
.topbar .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.burger{display:none;background:#fff;padding:9px 12px;border:1px solid var(--line)}
@media(max-width:900px){.burger{display:block}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card h3{font-size:15px;margin-bottom:14px;letter-spacing:-.2px}
.grid-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.metric{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.metric .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.metric .val{font-size:29px;font-weight:800;letter-spacing:-1px;margin-top:6px;color:var(--brand)}
.metric .hint{font-size:12px;color:var(--muted);margin-top:4px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.badge.ok{background:#d1fae5;color:#065f46}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.err{background:#fee2e2;color:#991b1b}
.badge.info{background:#dbeafe;color:#1e40af}
.badge.mut{background:#f1f5f9;color:#475569}

.list-item{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.list-item .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);flex-shrink:0}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .s{font-size:12.5px;color:var(--muted)}

.quote-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px;margin-bottom:13px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.quote-card .info{flex:1;min-width:220px}
.quote-card .nm{font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.quote-card .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.quote-card .val{font-size:19px;font-weight:800;color:var(--ok);letter-spacing:-.5px}
.quote-card .val small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:0}
.actions{display:flex;gap:7px;flex-wrap:wrap}

.price-pill{display:inline-flex;gap:8px;align-items:baseline;background:#f0fdf4;border:1px solid #bbf7d0;color:#065f46;padding:6px 11px;border-radius:9px;font-size:12.5px;font-weight:700}
.strike{text-decoration:line-through;color:var(--muted);font-weight:600}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
td.num,th.num{text-align:right}

.chip{display:inline-block;padding:3px 9px;border-radius:8px;background:#eef2f7;font-size:11.5px;font-weight:700;color:#334155}

.toast{position:fixed;bottom:22px;right:22px;background:#0f172a;color:#fff;padding:13px 19px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:999;animation:sl .25s ease}
@keyframes sl{from{transform:translateY(14px);opacity:0}}

.bracket-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.bracket-grid .field{margin:0}
.bracket-grid input{text-align:center;font-weight:700}

.praca-box{background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:12px;padding:13px 15px;font-size:13.5px;line-height:1.55}
.praca-box b{color:var(--brand)}
.praca-box.warn{background:#fffbeb;border-color:#fde68a}

.admin-layout{display:grid;grid-template-columns:240px 1fr;gap:16px}
@media(max-width:820px){.admin-layout{grid-template-columns:1fr}}
.praca-list button{display:block;width:100%;text-align:left;padding:10px 13px;border-radius:10px;background:#f8fafc;margin-bottom:6px;font-size:13.5px;font-weight:600;color:#334155}
.praca-list button.active{background:var(--brand);color:#fff}
.praca-list button:hover:not(.active){background:#eef2f7}

/* ---------- PROPOSTA PÚBLICA ---------- */
.pub-wrap{min-height:100vh;background:linear-gradient(180deg,#0b2b52,#0f172a);padding:30px 16px 60px}
.pub-inner{max-width:760px;margin:0 auto}
.prop{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.prop-head{background:linear-gradient(135deg,#0b4f9e,#0e7490);color:#fff;padding:26px 28px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.prop-head .logo{width:56px;height:56px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:800;font-size:22px;flex-shrink:0;overflow:hidden}
.prop-head .logo img{width:100%;height:100%;object-fit:cover}
.prop-head h3{font-size:19px;letter-spacing:-.3px}
.prop-head p{font-size:12.5px;opacity:.85;margin-top:2px}
.prop-body{padding:26px 28px}
.prop-sec{margin-bottom:22px}
.prop-sec h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:9px;border-bottom:1px solid var(--line);padding-bottom:6px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{font-weight:700}
.total-box{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #86efac;border-radius:14px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.total-box .big{font-size:27px;font-weight:800;color:#065f46;letter-spacing:-1px}
.prop-foot{padding:18px 28px 26px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);text-align:center;line-height:1.7}
@media print{body{background:#fff}.pub-wrap{background:#fff;padding:0}.prop{box-shadow:none;border-radius:0}}
</style>
</head>
<body>

<!-- ============ AUTENTICAÇÃO ============ -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><div class="mark">C</div><h1>CotaFácil</h1></div>
    <p class="auth-sub">Cotador inteligente de planos de saúde por praça</p>

    <div class="tabs">
      <button data-tab="login" class="active">Entrar</button>
      <button data-tab="register">Criar conta</button>
      <button data-tab="recover">Recuperar</button>
    </div>

    <form id="formLogin">
      <div class="field"><label>E-mail</label><input type="email" id="liEmail" required placeholder="voce@corretora.com"></div>
      <div class="field"><label>Senha</label><input type="password" id="liPass" required placeholder="••••••"></div>
      <button class="btn" style="width:100%">Entrar</button>
      <p class="auth-foot">Demo: <code>admin@cotafacil.com</code> / <code>123456</code></p>
    </form>

    <form id="formRegister" class="hidden">
      <div class="field"><label>Nome completo</label><input id="rgName" required placeholder="João Silva"></div>
      <div class="field"><label>E-mail</label><input type="email" id="rgEmail" required placeholder="voce@corretora.com"></div>
      <div class="field"><label>Senha (mín. 4)</label><input type="password" id="rgPass" required minlength="4"></div>
      <div class="row c2">
        <div class="field"><label>WhatsApp</label><input id="rgPhone" placeholder="(11) 99999-9999"></div>
        <div class="field"><label>Corretora</label><input id="rgBroker" placeholder="Minha Corretora"></div>
      </div>
      <button class="btn" style="width:100%">Criar conta</button>
    </form>

    <form id="formRecover" class="hidden">
      <div class="field"><label>E-mail cadastrado</label><input type="email" id="rcEmail" required></div>
      <div id="rcStep2" class="hidden">
        <div class="field"><label>Nova senha</label><input type="password" id="rcPass" minlength="4"></div>
      </div>
      <button class="btn" style="width:100%" id="rcBtn">Gerar código de recuperação</button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appScreen" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="mark">C</div><b>CotaFácil</b></div>
    <button class="nav-item" data-view="dashboard"><span class="ic">📊</span> Dashboard</button>
    <button class="nav-item" data-view="quote"><span class="ic">🧮</span> Nova cotação</button>
    <button class="nav-item" data-view="proposals"><span class="ic">📄</span> Propostas</button>
    <button class="nav-item" data-view="tasks"><span class="ic">✅</span> Tarefas</button>
    <button class="nav-item" data-view="admin"><span class="ic">⚙️</span> Tabelas / Praças</button>
    <button class="nav-item" data-view="profile"><span class="ic">👤</span> Meu perfil</button>
    <div class="spacer"></div>
    <div class="side-user" id="sideUser"></div>
    <button class="nav-item" id="btnLogout" style="margin-top:6px;color:#fca5a5"><span class="ic">⏻</span> Sair</button>
  </aside>
  <main class="main" id="main"></main>
</div>

<!-- ============ PROPOSTA PÚBLICA (link compartilhado) ============ -->
<div id="publicView" class="pub-wrap hidden"><div class="pub-inner" id="publicInner"></div></div>

<script>
/* =========================================================================
   1. CONSTANTES DE NEGÓCIO
   ========================================================================= */
const ANS_BRACKETS = ['0 a 18','19 a 23','24 a 28','29 a 33','34 a 38','39 a 43','44 a 48','49 a 53','54 a 58','59 ou mais'];

const PRACAS = {
  'Rio de Janeiro': ['Rio de Janeiro','Niterói','Duque de Caxias','São Gonçalo','São João de Meriti','Nilópolis','Belford Roxo','Mesquita','Nova Iguaçu','Magé','Itaboraí','Maricá','Queimados'],
  'Americana': ['Americana','Artur Nogueira','Cosmópolis','Nova Odessa',"Santa Bárbara D'Oeste"],
  'Campinas': ['Campinas','Valinhos','Paulínia','Hortolândia','Jaguariúna','Pedreira','Indaiatuba','Monte Mor','Holambra','Sumaré','Elias Fausto','Santo Antônio de Posse','Amparo'],
  'Jundiaí': ['Jundiaí','Várzea Paulista','Louveira','Itupeva','Cajamar','Vinhedo','Itatiba'],
  'Mogi das Cruzes': ['Mogi das Cruzes','Suzano','Poá','Itaquaquecetuba','Ferraz de Vasconcelos','Arujá','Guararema','Santa Isabel'],
  'Santos': ['Santos','São Vicente','Praia Grande','Guarujá','Cubatão','Bertioga','Mongaguá'],
  'São Bernardo do Campo': ['São Bernardo do Campo','Santo André','Diadema','São Caetano do Sul','Mauá','Ribeirão Pires','Rio Grande da Serra','Embu-Guaçu'],
  'São Paulo': ['São Paulo','Taboão da Serra','Carapicuíba','Guarulhos','Caieiras','Embu das Artes','Barueri','Osasco','Mairiporã','Jandira','Franco da Rocha','Itapecerica da Serra','Cotia','Itapevi'],
  'Sorocaba': ['Sorocaba','Votorantim','Araçoiaba da Serra','Salto de Pirapora','Alumínio','Piedade','Capela do Alto','Ibiúna','Iperó','São Roque','Porto Feliz','Salto','Itu','Cabreúva','Sarapuí','Araçariguama']
};

const CONTRACT_TYPES = [
  { id:'PF',  label:'Pessoa Física (PF)',        desc:'Titular e dependentes' },
  { id:'MEI', label:'Super Simples / MEI',       desc:'2 a 29 vidas' },
  { id:'PJ',  label:'PJ',                        desc:'30+ vidas' }
];

/* Faixas de CEP → praça regional (fallback do mapeamento inteligente) */
const CEP_MAP = [
  { praca:'Americana',              from:13460000, to:13479999 },
  { praca:'Jundiaí',                from:13200000, to:13299999 },
  { praca:'Campinas',               from:13000000, to:13199999 },
  { praca:'Campinas',               from:13300000, to:13399999 },
  { praca:'Mogi das Cruzes',        from:8500000,  to:8999999  },
  { praca:'São Bernardo do Campo',  from:9000000,  to:9999999  },
  { praca:'Santos',                 from:11000000, to:11999999 },
  { praca:'Sorocaba',               from:18000000, to:18599999 },
  { praca:'São Paulo',              from:1000000,  to:5999999  },
  { praca:'São Paulo',              from:6000000,  to:6999999  },
  { praca:'São Paulo',              from:7000000,  to:7999999  },
  { praca:'São Paulo',              from:8000000,  to:8499999  },
  { praca:'Rio de Janeiro',         from:20000000, to:28999999 }
];

const BASE_PF = {
  'Rio de Janeiro':215,'Americana':175,'Campinas':190,'Jundiaí':195,'Mogi das Cruzes':170,
  'Santos':185,'São Bernardo do Campo':180,'São Paulo':230,'Sorocaba':165
};
const AGE_FACTORS = [1,1.12,1.26,1.42,1.60,1.82,2.08,2.38,2.72,3.15];
const FIRST_MONTH_DISC = {
  'São Paulo':75,'Rio de Janeiro':60,'Campinas':50,'Jundiaí':45,
  'São Bernardo do Campo':50,'Santos':40,'Mogi das Cruzes':35,'Sorocaba':40,'Americana':35
};
const TYPE_FACTOR = { PF:1, MEI:0.82, PJ:0.70 };

/* =========================================================================
   2. PERSISTÊNCIA
   ========================================================================= */
const KEY = 'cotafacil.v1';
let DB = null;
let STATE = { view:'dashboard', selPraca:null };

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function money(n){ return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function buildDefaultTables(){
  const t = {};
  for (const praca of Object.keys(PRACAS)) {
    t[praca] = {};
    for (const ct of ['PF','MEI','PJ']) {
      const base = (BASE_PF[praca]||180) * TYPE_FACTOR[ct];
      const fd = ct === 'PF' ? (FIRST_MONTH_DISC[praca]||0) : Math.round((FIRST_MONTH_DISC[praca]||0)/2);
      t[praca][ct] = {
        prices: AGE_FACTORS.map(f => Math.round(base * f * 100)/100),
        discount: { firstMonth: fd, general: 0 }
      };
    }
  }
  return t;
}

function seed(){
  return {
    users: [{
      id:'admin', email:'admin@cotafacil.com', pass:'123456', role:'admin',
      name:'Administrador', phone:'(11) 99999-0000', social:'@cotafacil',
      brokerage:'CotaFácil Corretora', logo:'', photo:''
    }],
    session: null,
    quotes: [],
    tables: buildDefaultTables(),
    pracas: JSON.parse(JSON.stringify(PRACAS)),
    tasks: [{ id:uid(), text:'Revisar tabela de São Paulo (75% 1º mês)', done:false, due:new Date().toISOString().slice(0,10) }],
    notifications: []
  };
}

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) { DB = seed(); save(); return; }
    DB = JSON.parse(raw);
    if (!DB.tables) DB.tables = buildDefaultTables();
    if (!DB.pracas) DB.pracas = JSON.parse(JSON.stringify(PRACAS));
  } catch(e){ DB = seed(); save(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

function currentUser(){ return DB.users.find(u => u.id === DB.session) || null; }
function notify(text){ DB.notifications.unshift({ id:uid(), text, at:new Date().toISOString() }); DB.notifications = DB.notifications.slice(0,40); }

/* =========================================================================
   3. MOTOR DE MAPEAMENTO E CÁLCULO
   ========================================================================= */
function norm(s){
  return (s||'').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
}

/** Mapeamento inteligente cidade/CEP → praça (filial) */
function resolvePraca(city, cep){
  const n = norm(city);
  if (!n) return null;

  // 1) correspondência exata
  for (const [praca, cities] of Object.entries(DB.pracas)) {
    if (norm(praca) === n) return { praca, match:'exata', detail:'Nome da filial' };
    for (const c of cities) if (norm(c) === n) return { praca, match:'exata', detail:'Cidade cadastrada na praça' };
  }
  // 2) correspondência parcial (tolera acentos/typos leves)
  for (const [praca, cities] of Object.entries(DB.pracas)) {
    for (const c of cities) {
      const nc = norm(c);
      if (nc.includes(n) || n.includes(nc)) return { praca, match:'aproximada', detail:'Cidade "'+c+'"' };
    }
  }
  // 3) fallback por faixa de CEP (filial regional mais próxima)
  const digits = (cep||'').replace(/\D/g,'');
  if (digits.length >= 8) {
    const num = parseInt(digits.slice(0,8),10);
    const hit = CEP_MAP.find(r => num >= r.from && num <= r.to);
    if (hit && DB.tables[hit.praca]) return { praca:hit.praca, match:'regional', detail:'Faixa de CEP '+digits.slice(0,5)+'-'+digits.slice(5) };
  }
  return null;
}

/** Cálculo da cotação */
function calc(table, lives){
  let base = 0; const detail = [];
  lives.forEach((q,i) => {
    const qty = Number(q)||0;
    if (qty > 0) {
      const unit = Number(table.prices[i])||0;
      const sub = unit * qty;
      base += sub;
      detail.push({ faixa: ANS_BRACKETS[i], qty, unit, sub });
    }
  });
  const fd = Number(table.discount.firstMonth)||0;
  const gd = Number(table.discount.general)||0;
  const afterGeneral = base * (1 - gd/100);
  const first = afterGeneral * (1 - fd/100);
  return { base, detail, afterGeneral, first, fd, gd, totalLives: lives.reduce((a,b)=>a+(Number(b)||0),0) };
}

  if (!confirm('Excluir esta proposta?')) return;

/* =========================================================================
   9. TAREFAS
   ========================================================================= */
function viewTasks(){
  document.getElementById('main').innerHTML = `
    <div class="topbar">
      <button class="burger btn ghost small" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div><h2>Tarefas & Lembretes</h2><div class="sub">Organize seus follow-ups</div></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="row c3">
        <div class="field" style="grid-column:span 2"><label>Nova tarefa</label><input id="taskText" placeholder="Ex: Ligar para o cliente João"></div>
        <div class="field"><label>Data</label><input type="date" id="taskDue"></div>
      </div>
      <button class="btn" id="btnAddTask">Adicionar</button>
    </div>
    <div class="card">
      <h3>Lista</h3>
      ${DB.tasks.length ? DB.tasks.map(t => `
        <div class="list-item">
          <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')" style="width:auto;margin:0">
          <div class="grow">
            <div class="t" style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.text)}</div>
            <div class="s">${t.due ? new Date(t.due+'T12:00').toLocaleDateString('pt-BR') : 'sem data'}</div>
          </div>
          <button class="btn small danger" onclick="delTask('${t.id}')">🗑</button>
        </div>`).join('') : '<p style="color:var(--muted)">Nenhuma tarefa.</p>'}
    </div>`;

  document.getElementById('btnAddTask').onclick = () => {
    const text = document.getElementById('taskText').value.trim();
    if (!text) return toast('Digite a tarefa');
    DB.tasks.unshift({ id:uid(), text, done:false, due:document.getElementById('taskDue').value });
    save(); renderView(); toast('Tarefa adicionada');
  };
}
function toggleTask(id){ const t = DB.tasks.find(x=>x.id===id); if(t){ t.done=!t.done; save(); renderView(); } }
function delTask(id){ DB.tasks = DB.tasks.filter(x=>x.id!==id); save(); renderView(); }

      <button class="burger btn ghost small" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

    </div>

        </div>
        <button class="btn ghost small" style="width:100%;margin-top:10px" onclick="addPraca()">＋ Nova praça</button>
      </div>

      <div>
        <div class="card" style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
            <h3 style="margin:0">${esc(p)}</h3>
            <div class="actions">
              <button class="btn small ghost" onclick="editCities('${esc(p)}')">🏙 Editar cidades</button>
              <button class="btn small danger" onclick="delPraca('${esc(p)}')">🗑 Remover praça</button>
            </div>
          </div>
          <div style="display:flex;gap:6px;margin-top:14px;flex-wrap:wrap">
            ${CONTRACT_TYPES.map(c => `<button class="btn small ${c.id===ct?'':'ghost'}" onclick="setCT('${c.id}')">${c.label}</button>`).join('')}
          </div>
        </div>

        <div class="card" style="margin-bottom:16px">
          <h3>Preços por faixa etária — ${ct}</h3>
          <div class="bracket-grid">
            ${ANS_BRACKETS.map((b,i)=>`<div class="field"><label>${b}</label>
              <input type="number" step="0.01" min="0" value="${t.prices[i]}" data-price="${i}"></div>`).join('')}
          </div>
        </div>

        <div class="card" style="margin-bottom:16px">
          <h3>Descontos da praça</h3>
          <div class="row c2">
            <div class="field"><label>Desconto no 1º mês (%)</label><input type="number" min="0" max="100" value="${t.discount.firstMonth}" id="discFirst"></div>
            <div class="field"><label>Desconto geral recorrente (%)</label><input type="number" min="0" max="100" value="${t.discount.general}" id="discGeneral"></div>
          </div>
          <button class="btn" onclick="saveTable()">💾 Salvar tabela</button>
        </div>

        <div class="card">
          <h3>Cidades vinculadas a ${esc(p)}</h3>
          <p style="font-size:13px;color:var(--muted);line-height:1.65">${(DB.pracas[p]||[]).map(c=>`<span class="chip" style="margin:0 4px 5px 0">${esc(c)}</span>`).join('') || '—'}</p>
        </div>
      </div>
    </div>`;
}

function selPraca(p){ STATE.selPraca = p; renderView(); }
function setCT(c){ STATE.adminCT = c; renderView(); }

function saveTable(){
  const p = STATE.selPraca, ct = STATE.adminCT || 'PF';
  const prices = [...document.querySelectorAll('[data-price]')].map(i => Number(i.value)||0);
  DB.tables[p][ct] = {
    prices,
    discount: {
      firstMonth: Number(document.getElementById('discFirst').value)||0,
      general: Number(document.getElementById('discGeneral').value)||0
    }
  };
  save(); notify('Tabela atualizada: ' + p + ' / ' + ct);
  toast('Tabela salva'); renderView();
}

function editCities(p){
  const atual = (DB.pracas[p]||[]).join(', ');
  const novo = prompt('Cidades da praça ' + p + ' (separadas por vírgula):', atual);
  if (novo === null) return;
  DB.pracas[p] = novo.split(',').map(s=>s.trim()).filter(Boolean);
  save(); renderView(); toast('Cidades atualizadas');
}

function addPraca(){
  const nome = prompt('Nome da nova praça (filial):');
  if (!nome) return;
  if (DB.tables[nome]) return toast('Praça já existe');
  DB.tables[nome] = {
    PF:  { prices: AGE_FACTORS.map(f => Math.round(180*f*100)/100), discount:{firstMonth:0,general:0} },
    MEI: { prices: AGE_FACTORS.map(f => Math.round(180*0.82*f*100)/100), discount:{firstMonth:0,general:0} },
    PJ:  { prices: AGE_FACTORS.map(f => Math.round(180*0.70*f*100)/100), discount:{firstMonth:0,general:0} }
  };
  DB.pracas[nome] = [];
  STATE.selPraca = nome; save(); renderView(); toast('Praça criada');
}

function delPraca(p){
  if (Object.keys(DB.tables).length <= 1) return toast('É preciso manter ao menos uma praça');
  if (!confirm('Remover a praça "' + p + '" e suas tabelas?')) return;
  delete DB.tables[p]; delete DB.pracas[p];
  STATE.selPraca = Object.keys(DB.tables)[0];
  save(); renderView(); toast('Praça removida');
}

/* =========================================================================
   12. PROPOSTA PÚBLICA (link compartilhado)
   ========================================================================= */
function renderPublic(){
  const raw = location.hash.slice(3);
  let data;
  try { data = JSON.parse(decodeURIComponent(atob(raw))); }
  catch(e){
    document.getElementById('publicInner').innerHTML =
      '<div class="prop"><div class="prop-body"><h3>Link inválido</h3><p style="color:#64748b;margin-top:8px">Não foi possível carregar a proposta.</p></div></div>';
    document.getElementById('publicView').classList.remove('hidden');
    document.getElementById('authScreen').classList.add('hidden');
    return;
  }
  const { q, u } = data;

  // contabiliza abertura (demo local: só funciona no mesmo navegador)
  const local = DB.quotes.find(x => x.id === q.id);
  if (local) { local.opens = (local.opens||0) + 1; save(); }

  document.getElementById('publicInner').innerHTML = `
    <div class="prop">${proposalBody(q, u || {})}</div>
    <div style="text-align:center;margin-top:22px;color:#94a3b8;font-size:12.5px">
      Proposta gerada por <b style="color:#e2e8f0">CotaFácil</b>
    </div>`;
  document.getElementById('publicView').classList.remove('hidden');
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.add('hidden');
}

/* =========================================================================
   13. UTIL
   ========================================================================= */
let toastTimer = null;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.remove(), 2800);
}

/* =========================================================================
   14. BOOT
   ========================================================================= */
load();
if (location.hash.startsWith('#p=')) renderPublic();
else if (DB.session && currentUser()) showApp();
else showAuth();

window.addEventListener('hashchange', () => {
  if (location.hash.startsWith('#p=')) renderPublic();
  else if (DB.session && currentUser()) showApp();
  else showAuth();
});
</script>
