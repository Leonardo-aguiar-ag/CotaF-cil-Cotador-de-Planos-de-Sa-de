<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CotaFácil — CRM de Planos de Saúde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#1e40af; --brand-2:#0d9488; --brand-3:#6366f1;
  --accent:#f59e0b; --accent-2:#f97316;
  --ink:#0f172a; --ink-2:#1e293b; --muted:#64748b; --muted-2:#94a3b8;
  --bg:#f8fafc; --bg-2:#f1f5f9; --card:#ffffff; --line:#e2e8f0; --line-2:#f1f5f9;
  --ok:#059669; --ok-bg:#ecfdf5; --warn:#d97706; --warn-bg:#fffbeb; --err:#dc2626; --err-bg:#fef2f2;
  --radius:16px; --radius-sm:10px; --radius-lg:22px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --shadow:0 2px 8px rgba(15,23,42,.06),0 8px 24px -8px rgba(15,23,42,.08);
  --shadow-lg:0 20px 50px -12px rgba(15,23,42,.25),0 8px 16px -8px rgba(15,23,42,.12);
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;border-radius:11px;font-weight:600;font-size:14px;transition:all .15s cubic-bezier(.4,0,.2,1)}
button:active{transform:scale(.98)}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);outline:none;transition:all .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(30,64,175,.1)}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}
.field{margin-bottom:15px}
.row{display:grid;gap:15px}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:720px){.row.c2,.row.c3{grid-template-columns:1fr}}
.hidden{display:none!important}

.btn{padding:11px 20px;background:linear-gradient(135deg,var(--brand),var(--brand-3));color:#fff;box-shadow:0 1px 2px rgba(30,64,175,.2),0 4px 12px -2px rgba(30,64,175,.35);font-size:14px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px -2px rgba(30,64,175,.45)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:var(--shadow-sm)}
.btn.ghost:hover{background:var(--bg-2);border-color:#cbd5e1}
.btn.small{padding:8px 14px;font-size:13px;border-radius:9px}
.btn.danger{background:var(--err-bg);color:var(--err);box-shadow:none;border:1.5px solid #fecaca}
.btn.danger:hover{background:#fee2e2}
.btn.danger:disabled,.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn.ok{background:linear-gradient(135deg,var(--ok),#10b981);color:#fff}
.btn.ok:hover{box-shadow:0 4px 16px -2px rgba(5,150,105,.4)}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 700px at 15% -10%,#312e81 0%,#1e1b4b 40%,#0f172a 100%);position:relative;overflow:hidden}
.auth-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(600px 400px at 90% 100%,rgba(13,148,136,.25),transparent 60%),radial-gradient(500px 300px at 10% 90%,rgba(99,102,241,.2),transparent 60%);pointer-events:none}
.auth-card{position:relative;width:100%;max-width:440px;background:#fff;border-radius:24px;padding:36px 32px;box-shadow:var(--shadow-lg)}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.auth-logo .mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand-3));display:grid;place-items:center;color:#fff;font-size:21px;font-weight:900;letter-spacing:-1px;box-shadow:0 4px 14px -2px rgba(30,64,175,.5)}
.auth-logo h1{font-size:22px;letter-spacing:-.5px;font-weight:800}
.auth-sub{color:var(--muted);font-size:13.5px;margin-bottom:24px}
.tabs{display:flex;gap:4px;background:var(--bg-2);padding:4px;border-radius:12px;margin-bottom:22px}
.tabs button{flex:1;padding:9px;background:transparent;color:var(--muted);font-size:13px;border-radius:9px;font-weight:600;box-shadow:none}
.tabs button.active{background:#fff;color:var(--brand);box-shadow:var(--shadow-sm)}
.auth-foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.6}
.auth-foot code{background:var(--bg-2);padding:2px 7px;border-radius:5px;color:var(--brand);font-size:11.5px;font-weight:600}

/* SHELL */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-260px;z-index:60;height:100vh;transition:left .3s;width:250px}.sidebar.open{left:0;box-shadow:var(--shadow-lg)}}
.sidebar{background:linear-gradient(180deg,#0f172a 0%,#1e1b4b 100%);color:#cbd5e1;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;color:#fff}
.sidebar .brand .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--brand-2),#22d3ee);display:grid;place-items:center;font-weight:900;font-size:17px;letter-spacing:-1px;box-shadow:0 4px 14px -2px rgba(13,148,136,.5)}
.sidebar .brand b{font-size:16px;letter-spacing:-.3px;font-weight:800}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;color:#94a3b8;font-size:14px;font-weight:600;background:transparent;text-align:left;width:100%}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(13,148,136,.9),rgba(30,64,175,.6));color:#fff;box-shadow:0 4px 14px -2px rgba(13,148,136,.4)}
.nav-item .ic{width:20px;text-align:center;font-size:15px}
.sidebar .spacer{flex:1}
.side-user{display:flex;align-items:center;gap:10px;padding:11px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
.side-user img,.side-user .av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--brand),var(--brand-3));display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0}
.side-user .nm{font-size:13px;font-weight:700;color:#fff;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user .em{font-size:11px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{padding:28px 32px 70px;overflow-x:hidden;max-width:1500px;margin:0 auto;width:100%}
@media(max-width:720px){.main{padding:20px 16px 60px}}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.topbar h2{font-size:25px;letter-spacing:-.7px;font-weight:800}
.topbar .sub{color:var(--muted);font-size:13.5px;margin-top:3px;font-weight:500}
.burger{display:none;background:#fff;padding:10px 13px;border:1.5px solid var(--line);box-shadow:var(--shadow-sm)}
@media(max-width:900px){.burger{display:block}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm)}
.card h3{font-size:15px;margin-bottom:16px;letter-spacing:-.2px;font-weight:800}

/* FILTER */
.filterbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.filterbar .field{margin:0;min-width:150px}
.filterbar .grow{flex:1}
.filterbar .actions{display:flex;gap:8px;margin-left:auto}

/* METRICS */
.grid-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.metric{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:all .2s}
.metric:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--brand-3))}
.metric.ok::before{background:linear-gradient(90deg,var(--ok),#10b981)}
.metric.warn::before{background:linear-gradient(90deg,var(--warn),var(--accent-2))}
.metric.err::before{background:linear-gradient(90deg,var(--err),#f87171)}
.metric .lbl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.metric .val{font-size:26px;font-weight:900;letter-spacing:-1px;margin-top:8px;color:var(--ink);line-height:1.05}
.metric .val.sm{font-size:22px}
.metric.ok .val{color:var(--ok)}.metric.warn .val{color:var(--warn)}.metric.err .val{color:var(--err)}
.metric .hint{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:500}

/* FUNNEL */
.funnel{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
@media(max-width:720px){.funnel{grid-template-columns:1fr}}
.funnel-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.funnel-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.funnel-card .tier{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;margin-bottom:6px}
.funnel-card .count{font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1}
.funnel-card .desc{font-size:12px;color:var(--muted);font-weight:600;margin-top:5px}
.funnel-card.d3{border-color:#fde68a;background:linear-gradient(135deg,#fffbeb,#fef3c7)}
.funnel-card.d3 .tier{color:#92400e}.funnel-card.d3 .count{color:#b45309}
.funnel-card.d7{border-color:#fdba74;background:linear-gradient(135deg,#fff7ed,#ffedd5)}
.funnel-card.d7 .tier{color:#9a3412}.funnel-card.d7 .count{color:#c2410c}
.funnel-card.d15{border-color:#fca5a5;background:linear-gradient(135deg,#fef2f2,#fee2e2)}
.funnel-card.d15 .tier{color:#991b1b}.funnel-card.d15 .count{color:#b91c1c}
.funnel-card.active{box-shadow:0 0 0 3px rgba(30,64,175,.18),var(--shadow)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:700}
.badge.ok{background:var(--ok-bg);color:#065f46}
.badge.warn{background:var(--warn-bg);color:#92400e}
.badge.err{background:var(--err-bg);color:#991b1b}
.badge.info{background:#dbeafe;color:#1e40af}
.badge.mut{background:var(--bg-2);color:#475569}
.badge.brand{background:#ede9fe;color:#5b21b6}

/* QUOTE CARDS */
.quote-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow-sm);transition:all .2s}
.quote-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.quote-card .info{flex:1;min-width:230px}
.quote-card .nm{font-size:16px;font-weight:800;letter-spacing:-.3px}
.quote-card .meta{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:500}
.quote-card .val{font-size:21px;font-weight:800;color:var(--ok);letter-spacing:-.6px}
.quote-card .val small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:0;margin-top:2px}
.actions{display:flex;gap:7px;flex-wrap:wrap}

/* MISC */
.chip{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--bg-2);font-size:11.5px;font-weight:700;color:#334155}
.chip.plan{background:#ede9fe;color:#5b21b6}
.toast{position:fixed;bottom:24px;right:24px;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:14px 20px;border-radius:13px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);z-index:999;animation:sl .25s ease}
@keyframes sl{from{transform:translateY(16px);opacity:0}}

/* QUOTE FORM */
.praca-box{background:linear-gradient(135deg,#eff6ff,#f0f9ff);border:1.5px solid #bfdbfe;border-radius:13px;padding:14px 16px;font-size:13.5px;line-height:1.55;transition:all .2s}
.praca-box b{color:var(--brand);font-weight:800}
.praca-box.warn{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fde68a}
.praca-box.warn b{color:var(--warn)}

.bracket-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px}
.bracket-grid .field{margin:0}
.bracket-grid input{text-align:center;font-weight:700;font-size:15px}

.ct-option,.ac-option{display:flex;gap:12px;align-items:center;padding:13px;border:1.5px solid var(--line);border-radius:13px;margin-bottom:9px;cursor:pointer;transition:all .15s;background:#fff}
.ct-option:hover,.ac-option:hover{border-color:#cbd5e1;background:var(--bg)}
.ct-option:has(input:checked),.ac-option:has(input:checked){border-color:var(--brand);background:linear-gradient(135deg,#eff6ff,#f0f9ff);box-shadow:0 0 0 3px rgba(30,64,175,.08)}
.ct-option input,.ac-option input{width:auto;margin:0;accent-color:var(--brand)}
.ct-option b,.ac-option b{font-size:14px;font-weight:700}
.ct-option .desc,.ac-option .desc{font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}

.birth-conv{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #86efac;border-radius:13px;padding:14px 16px;margin-top:18px;display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.birth-conv .field{margin:0;flex:1;min-width:170px}
.birth-conv .field label{color:#065f46}

/* PLAN OPTIONS (COTAÇÃO) */
.plan-options{margin-bottom:20px}
.plan-option{display:flex;align-items:center;gap:14px;padding:15px 18px;border:2px solid var(--line);border-radius:14px;margin-bottom:9px;cursor:pointer;transition:all .15s;background:#fff;position:relative}
.plan-option:hover{border-color:#cbd5e1;background:var(--bg)}
.plan-option.selected{border-color:var(--brand);background:linear-gradient(135deg,#eff6ff,#f0f9ff);box-shadow:0 0 0 3px rgba(30,64,175,.08)}
.plan-option input[type=radio]{width:auto;margin:0;accent-color:var(--brand);flex-shrink:0}
.plan-option .plan-info{flex:1;min-width:0}
.plan-option .plan-name{font-size:15px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan-option .plan-name .rec{font-size:10.5px;font-weight:800;background:#fbbf24;color:#78350f;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px}
.plan-option .plan-prices{display:flex;gap:22px;margin-top:7px;flex-wrap:wrap;align-items:baseline}
.plan-option .plan-prices .block{display:flex;flex-direction:column}
.plan-option .plan-prices .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800;margin-bottom:2px}
.plan-option .plan-prices .v{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
.plan-option .plan-prices .v.strike{text-decoration:line-through;color:var(--muted-2);font-size:12.5px}
.plan-option .plan-prices .v.promo{color:var(--ok)}
.plan-option .plan-prices .v.rec{color:var(--brand)}

.preview-table{width:100%;border-collapse:collapse;font-size:13.5px}
.preview-table th,.preview-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-2)}
.preview-table th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800}
.preview-table td.num,.preview-table th.num{text-align:right}
.preview-values{display:flex;gap:26px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:18px;border-top:1px dashed var(--line)}
.preview-values .lbl{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.preview-values .num{font-size:22px;font-weight:800;letter-spacing:-.6px;margin-top:3px}
.preview-values .num.strike{text-decoration:line-through;color:var(--muted-2);font-weight:700}
.price-pill{display:inline-flex;gap:8px;align-items:baseline;background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1.5px solid #86efac;color:#065f46;padding:8px 14px;border-radius:11px;font-size:13px;font-weight:800}

/* ADMIN */
.admin-shell{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
@media(max-width:960px){.admin-shell{grid-template-columns:1fr}}
.pracas-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;position:sticky;top:20px}
@media(max-width:960px){.pracas-panel{position:static}}
.pracas-panel-head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.pracas-panel-head h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px;font-weight:800}
.search-wrap{position:relative}
.search-wrap input{padding-left:34px;font-size:13px;padding-top:9px;padding-bottom:9px}
.search-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5}
.pracas-list{max-height:calc(100vh - 260px);overflow-y:auto;padding:8px}
@media(max-width:960px){.pracas-list{max-height:340px}}
.praca-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;cursor:pointer;transition:all .15s;margin-bottom:2px;border:1.5px solid transparent}
.praca-item:hover{background:var(--bg)}
.praca-item.active{background:linear-gradient(135deg,#eff6ff,#f0f9ff);border-color:#bfdbfe}
.praca-item .dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1;flex-shrink:0}
.praca-item.active .dot{background:linear-gradient(135deg,var(--brand),var(--brand-3));box-shadow:0 0 0 3px rgba(30,64,175,.15)}
.praca-item .nm{flex:1;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.praca-item .base{font-size:11.5px;font-weight:800;color:var(--muted);background:var(--bg-2);padding:3px 8px;border-radius:7px;flex-shrink:0}
.praca-item.active .base{background:#dbeafe;color:var(--brand)}
.pracas-panel-foot{padding:12px 16px;border-top:1px solid var(--line);background:var(--bg-2)}

.editor{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.editor-head{padding:22px 26px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#fafbff,#f0f9ff);display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.editor-head h2{font-size:22px;letter-spacing:-.5px;font-weight:800;margin:0}
.editor-head .cities-count{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:4px}
.editor-body{padding:26px}

.dim-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;color:var(--muted);margin:22px 0 10px}
.dim-label:first-child{margin-top:0}
.ct-tabs,.ac-tabs{display:flex;gap:8px;background:var(--bg-2);padding:5px;border-radius:14px;margin-bottom:8px;flex-wrap:wrap}
.ct-tabs button,.ac-tabs button{flex:1;min-width:110px;padding:10px 12px;background:transparent;color:var(--muted);font-size:13px;border-radius:10px;font-weight:700;box-shadow:none}
.ct-tabs button:hover,.ac-tabs button:hover{color:var(--ink)}
.ct-tabs button.active,.ac-tabs button.active{background:#fff;color:var(--brand);box-shadow:var(--shadow-sm)}

/* Plan tabs no admin */
.plan-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.plan-tab{padding:10px 16px;border-radius:11px;background:var(--bg-2);color:var(--muted);font-weight:700;font-size:13px;transition:all .15s;box-shadow:none;border:1.5px solid transparent}
.plan-tab:hover{background:var(--line);color:var(--ink)}
.plan-tab.active{background:linear-gradient(135deg,var(--brand),var(--brand-3));color:#fff;box-shadow:0 4px 12px -2px rgba(30,64,175,.35)}
.plan-add{padding:10px 16px;border-radius:11px;background:transparent;color:var(--brand);font-weight:700;font-size:13px;border:1.5px dashed #bfdbfe}
.plan-add:hover{background:#eff6ff}

.plan-meta{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap;padding:14px 16px;background:var(--bg-2);border-radius:12px}
.plan-meta .nm-input{flex:1;min-width:200px;margin:0}
.plan-meta .nm-input input{font-weight:800;font-size:15px}

.discounts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}

.discount-card{background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1.5px solid #fed7aa;border-radius:15px;padding:18px 20px}
.discount-card.geral{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-color:#bfdbfe}
.discount-card .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;color:#9a3412;margin-bottom:4px}
.discount-card.geral .label{color:#1e40af}
.discount-card .value{font-size:34px;font-weight:900;letter-spacing:-1.2px;color:#c2410c;line-height:1;margin-bottom:14px}
.discount-card.geral .value{color:var(--brand)}
.discount-card input[type=range]{width:100%;-webkit-appearance:none;height:8px;border-radius:999px;background:rgba(194,65,12,.15);outline:none;margin:6px 0 10px;padding:0;border:none}
.discount-card.geral input[type=range]{background:rgba(30,64,175,.15)}
.discount-card input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #c2410c;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer}
.discount-card.geral input[type=range]::-webkit-slider-thumb{border-color:var(--brand)}
.discount-card .quick-nums{display:flex;gap:6px;flex-wrap:wrap}
.discount-card .quick-nums button{background:rgba(255,255,255,.75);border:1px solid rgba(194,65,12,.25);color:#9a3412;padding:5px 10px;border-radius:8px;font-size:11.5px;font-weight:700}
.discount-card.geral .quick-nums button{border-color:rgba(30,64,175,.25);color:var(--brand)}

.price-section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 16px;flex-wrap:wrap}
.price-section-head h3{font-size:14px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px}
.price-section-head .adjust{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}

.price-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.price-card{background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:14px 14px 12px;transition:all .15s}
.price-card:hover{border-color:#cbd5e1;background:#fff;box-shadow:var(--shadow-sm)}

.price-card .age{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px}

.price-card input[type=number]{border:none;padding:0;font-size:19px;font-weight:800;letter-spacing:-.6px;color:var(--ink);background:transparent;box-shadow:none;text-align:left;width:100%}
.price-card input[type=number]:focus{box-shadow:none}
.price-card input[type=number]::-webkit-outer-spin-button,.price-card input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.price-card .hint{font-size:11px;color:var(--muted-2);margin-top:6px;font-weight:600}

.mini-preview{background:linear-gradient(135deg,#fafbff,#f0f9ff);border:1.5px solid #bfdbfe;border-radius:15px;padding:18px 20px;margin:18px 0}
.mini-preview h4{font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;color:var(--brand);margin-bottom:14px;display:flex;align-items:center;gap:7px}
.mini-preview .example{display:flex;gap:24px;flex-wrap:wrap}
.mini-preview .example .col .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;color:var(--muted);margin-bottom:4px}
.mini-preview .example .col .v{font-size:17px;font-weight:800;letter-spacing:-.4px}
.mini-preview .example .col .v.strike{text-decoration:line-through;color:var(--muted-2)}

.editor-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:22px;border-top:1px dashed var(--line);flex-wrap:wrap}
.copy-wrap{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);font-weight:600;flex-wrap:wrap}

.saved-indicator{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ok);opacity:0;transition:opacity .3s}
.saved-indicator.show{opacity:1}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.7);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:22px;box-shadow:var(--shadow-lg);width:100%;max-width:720px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
.modal-head{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}

.modal-foot{padding:16px 26px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--bg-2)}
.dropzone{border:2.5px dashed #cbd5e1;border-radius:14px;padding:30px;text-align:center;transition:all .15s;background:var(--bg-2)}
.dropzone:hover,.dropzone.drag{border-color:var(--brand);background:#eff6ff}
.dropzone .icon{font-size:32px;margin-bottom:8px}

.import-preview{margin-top:18px;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:12px}

/* PROPOSTA PÚBLICA */

.prop-sec{margin-bottom:24px}
.prop-sec h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:7px;font-weight:800}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{font-weight:700;margin:0}
.cover-list{list-style:none;padding:0;display:grid;gap:7px;font-size:13.5px}
.cover-list li{display:flex;gap:9px;align-items:flex-start;line-height:1.5}
.cover-list li::before{content:'✓';color:var(--ok);font-weight:900;flex-shrink:0}
.cover-list li.off::before{content:'✕';color:var(--err)}
.total-box{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1.5px solid #86efac;border-radius:16px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.total-box .big{font-size:30px;font-weight:900;color:#065f46;letter-spacing:-1px}

@media print{body{background:#fff}.pub-wrap{background:#fff;padding:0}.prop{box-shadow:none;border-radius:0}}
</style>
</head>

<script>
/* =========================================================================
   1. CONSTANTES
   ========================================================================= */
const ANS_BRACKETS = ['0 a 18','19 a 23','24 a 28','29 a 33','34 a 38','39 a 43','44 a 48','49 a 53','54 a 58','59 ou mais'];

const PRACAS = {
  'Rio de Janeiro': ['Rio de Janeiro','Niterói','Duque de Caxias','São Gonçalo','São João de Meriti','Nilópolis','Belford Roxo','Mesquita','Nova Iguaçu','Magé','Itaboraí','Maricá','Queimados'],
  'Americana': ['Americana','Artur Nogueira','Cosmópolis','Nova Odessa',"Santa Bárbara D'Oeste"],
  'Campinas': ['Campinas','Valinhos','Paulínia','Hortolândia','Jaguariúna','Pedreira','Indaiatuba','Monte Mor','Holambra','Sumaré','Elias Fausto','Santo Antônio de Posse','Amparo'],
  'Jundiaí': ['Jundiaí','Várzea Paulista','Louveira','Itupeva','Cajamar','Vinhedo','Itatiba'],
  'Mogi das Cruzes': ['Mogi das Cruzes','Suzano','Poá','Itaquaquecetuba','Ferraz de Vasconcelos','Arujá','Guararema','Santa Isabel'],
  'Santos': ['Santos','São Vicente','Praia Grande','Guarujá','Cubatão','Bertioga','Mongaguá'],
  'São Bernardo do Campo': ['São Bernardo do Campo','Santo André','Diadema','São Caetano do Sul','Mauá','Ribeirão Pires','Rio Grande da Serra','Embu-Guaçu'],
  'São Paulo': ['São Paulo','Taboão da Serra','Carapicuíba','Guarulhos','Caieiras','Embu das Artes','Barueri','Osasco','Mairiporã','Jandira','Franco da Rocha','Itapecerica da Serra','Cotia','Itapevi'],
  'Sorocaba': ['Sorocaba','Votorantim','Araçoiaba da Serra','Salto de Pirapora','Alumínio','Piedade','Capela do Alto','Ibiúna','Iperó','São Roque','Porto Feliz','Salto','Itu','Cabreúva','Sarapuí','Araçariguama']
};

const CONTRACT_TYPES = [
  { id:'PF',  label:'Pessoa Física (PF)',    desc:'Titular e dependentes' },
  { id:'MEI', label:'MEI',                    desc:'Microempreendedor individual' },
  { id:'ME',  label:'ME / Demais Empresas',   desc:'ME, EPP e demais PJs' }
];

const ACCOMMODATIONS = [
  { id:'Ambulatorial', label:'Ambulatorial', desc:'Sem internação hospitalar', mult:1.00 },
  { id:'Enfermaria',   label:'Enfermaria',   desc:'Internação em quarto coletivo', mult:1.15 },
  { id:'Apartamento',  label:'Apartamento',  desc:'Internação em apartamento individual', mult:1.40 }
];

const CEP_MAP = [
  { praca:'Americana',              from:13460000, to:13479999 },
  { praca:'Jundiaí',                from:13200000, to:13299999 },
  { praca:'Campinas',               from:13000000, to:13199999 },
  { praca:'Campinas',               from:13300000, to:13399999 },
  { praca:'Mogi das Cruzes',        from:8500000,  to:8999999  },
  { praca:'São Bernardo do Campo',  from:9000000,  to:9999999  },
  { praca:'Santos',                 from:11000000, to:11999999 },
  { praca:'Sorocaba',               from:18000000, to:18599999 },
  { praca:'São Paulo',              from:1000000,  to:5999999  },
  { praca:'São Paulo',              from:6000000,  to:6999999  },
  { praca:'São Paulo',              from:7000000,  to:7999999  },
  { praca:'São Paulo',              from:8000000,  to:8499999  },
  { praca:'Rio de Janeiro',         from:20000000, to:28999999 }
];

const BASE_PF = {
  'Rio de Janeiro':215,'Americana':175,'Campinas':190,'Jundiaí':195,'Mogi das Cruzes':170,
  'Santos':185,'São Bernardo do Campo':180,'São Paulo':230,'Sorocaba':165
};
const AGE_FACTORS = [1,1.12,1.26,1.42,1.60,1.82,2.08,2.38,2.72,3.15];
const FIRST_MONTH_DISC = {
  'São Paulo':75,'Rio de Janeiro':60,'Campinas':50,'Jundiaí':45,
  'São Bernardo do Campo':50,'Santos':40,'Mogi das Cruzes':35,'Sorocaba':40,'Americana':35
};
const TYPE_FACTOR = { PF:1, MEI:0.82, ME:0.70 };

const COVERAGES = {
  'Ambulatorial': [
    { ok:true,  t:'Consultas em consultório' },
    { ok:true,  t:'Exames laboratoriais e de imagem' },
    { ok:true,  t:'Terapias (fisioterapia, fonoaudiologia, etc)' },
    { ok:true,  t:'Procedimentos ambulatoriais' },
    { ok:false, t:'Internação hospitalar (não coberta)' }
  ],
  'Enfermaria': [
    { ok:true, t:'Todas as coberturas ambulatoriais' },
    { ok:true, t:'Internação hospitalar em enfermaria (quarto coletivo)' },
    { ok:true, t:'Cirurgias' },
    { ok:true, t:'Obstetrícia' },
    { ok:true, t:'UTI' }
  ],
  'Apartamento': [
    { ok:true, t:'Todas as coberturas de enfermaria' },
    { ok:true, t:'Internação em apartamento individual' },
    { ok:true, t:'Maior conforto e privacidade' },
    { ok:true, t:'Acompanhante em internações' }
  ]
};

/* =========================================================================
   2. PERSISTÊNCIA — schema v4 (planos como array)
   ========================================================================= */
const KEY = 'cotafacil.v4';
let DB = null;
let STATE = {
  view:'dashboard',
  selPraca:null, adminCT:'PF', adminAC:'Ambulatorial', adminPlanId:null,
  dashFilter:{ period:'30d', praca:'', funnel:null },
  detected:null,
  quoteSelPlanId:null
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function money(n){ return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function moneyShort(n){ n = Number(n)||0; if (n>=1e6) return 'R$ '+(n/1e6).toFixed(1)+'M'; if (n>=1e3) return 'R$ '+(n/1e3).toFixed(1)+'k'; return 'R$ '+n.toFixed(0); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function makePlan(name, prices, firstMonth, general){
  return { id:uid(), name, prices:prices.map(p => Math.round(p*100)/100), discount:{ firstMonth:firstMonth||0, general:general||0 } };
}

function buildDefaultTables(){
  const t = {};
  for (const praca of Object.keys(PRACAS)) {
    t[praca] = {};
    for (const ct of ['PF','MEI','ME']) {
      t[praca][ct] = {};
      const typeF = TYPE_FACTOR[ct];
      const fd = ct === 'PF' ? (FIRST_MONTH_DISC[praca]||0) : ct === 'MEI' ? Math.round((FIRST_MONTH_DISC[praca]||0)/2) : Math.round((FIRST_MONTH_DISC[praca]||0)/4);
      for (const ac of ACCOMMODATIONS) {
        const base = (BASE_PF[praca]||180) * typeF * ac.mult;
        t[praca][ct][ac.id] = [
          makePlan('Essencial', AGE_FACTORS.map(f => base * f), fd, 0),
          makePlan('Premium',   AGE_FACTORS.map(f => base * 1.35 * f), fd, 0)
        ];
      }
    }
  }
  return t;
}

function seed(){
  return {
    users: [{ id:'admin', email:'admin@cotafacil.com', pass:'123456', role:'admin', name:'Administrador', phone:'(11) 99999-0000', social:'@cotafacil', brokerage:'CotaFácil Corretora', logo:'', photo:'' }],
    session: null, quotes: [], tables: buildDefaultTables(),
    pracas: JSON.parse(JSON.stringify(PRACAS)),
    tasks: [{ id:uid(), text:'Revisar tabela de São Paulo (75% 1º mês)', done:false, due:new Date().toISOString().slice(0,10) }],
    notifications: []
  };
}

function migrate(old){
  if (!old || !old.tables) return old;
  const firstPraca = old.tables[Object.keys(old.tables)[0]];
  const firstCT = firstPraca && firstPraca[Object.keys(firstPraca)[0]];

  // v2 → v3: {prices,discount} no nível CT → objeto por acomodação
  if (firstCT && firstCT.prices) {
    const nt = {};
    for (const [praca, ctMap] of Object.entries(old.tables)) {
      nt[praca] = {};
      for (const [ct, oldT] of Object.entries(ctMap)) {
        nt[praca][ct] = {};
        for (const ac of ACCOMMODATIONS) {
          nt[praca][ct][ac.id] = [makePlan('Padrão', oldT.prices.map(v => v * ac.mult), oldT.discount.firstMonth, oldT.discount.general)];
        }
      }
    }
    old.tables = nt;
  }

  // v3 → v4: objeto por acomodação → array de planos
  for (const praca of Object.keys(old.tables)) {
    for (const ct of Object.keys(old.tables[praca])) {
      for (const ac of Object.keys(old.tables[praca][ct])) {
        const val = old.tables[praca][ct][ac];
        if (val && !Array.isArray(val) && Array.isArray(val.prices)) {
          old.tables[praca][ct][ac] = [makePlan('Padrão', val.prices, val.discount?.firstMonth || 0, val.discount?.general || 0)];
        }
      }
    }
  }
  return old;
}

function load(){
  try {
    const raw = localStorage.getItem(KEY) || localStorage.getItem('cotafacil.v3') || localStorage.getItem('cotafacil.v2');
    if (!raw) { DB = seed(); save(); return; }
    DB = migrate(JSON.parse(raw));
    if (!DB.tables) DB.tables = buildDefaultTables();
    if (!DB.pracas) DB.pracas = JSON.parse(JSON.stringify(PRACAS));
    if (!DB.quotes) DB.quotes = [];
    save();
  } catch(e){ console.error(e); DB = seed(); save(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
function currentUser(){ return DB.users.find(u => u.id === DB.session) || null; }
function notify(text){ DB.notifications.unshift({ id:uid(), text, at:new Date().toISOString() }); DB.notifications = DB.notifications.slice(0,40); }

/* =========================================================================
   3. HELPERS DE PLANO
   ========================================================================= */
function getPlans(praca, ct, ac){
  const t = DB.tables[praca]?.[ct]?.[ac];
  if (!Array.isArray(t)) return [];
  return t;
}

/* =========================================================================
   4. MOTOR
   ========================================================================= */
function norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }

function resolvePraca(city, cep){
  const n = norm(city); if (!n) return null;
  for (const [praca, cities] of Object.entries(DB.pracas)) {
    if (norm(praca) === n) return { praca, match:'exata', detail:'Nome da filial' };
    for (const c of cities) if (norm(c) === n) return { praca, match:'exata', detail:'Cidade cadastrada' };
  }
  for (const [praca, cities] of Object.entries(DB.pracas)) {
    for (const c of cities) {
      const nc = norm(c);
      if (nc.includes(n) || n.includes(nc)) return { praca, match:'aproximada', detail:'Cidade "'+c+'"' };
    }
  }
  const digits = (cep||'').replace(/\D/g,'');
  if (digits.length >= 8) {
    const num = parseInt(digits.slice(0,8),10);
    const hit = CEP_MAP.find(r => num >= r.from && num <= r.to);
    if (hit && DB.tables[hit.praca]) return { praca:hit.praca, match:'regional', detail:'Faixa de CEP '+digits.slice(0,5)+'-'+digits.slice(5) };
  }
  return null;
}

function calc(plan, lives){
  let base = 0; const detail = [];
  lives.forEach((q,i) => {
    const qty = Number(q)||0;
    if (qty > 0) {
      const unit = Number(plan.prices[i])||0;
      const sub = unit * qty;
      base += sub;
      detail.push({ faixa: ANS_BRACKETS[i], qty, unit, sub });
    }
  });
  const fd = Number(plan.discount.firstMonth)||0;
  const gd = Number(plan.discount.general)||0;
  const afterGeneral = base * (1 - gd/100);
  const first = afterGeneral * (1 - fd/100);
  return { base, detail, afterGeneral, first, fd, gd, totalLives: lives.reduce((a,b)=>a+(Number(b)||0),0) };
}

function ageToBracket(age){
  if (age <= 18) return 0; if (age <= 23) return 1; if (age <= 28) return 2; if (age <= 33) return 3;
  if (age <= 38) return 4; if (age <= 43) return 5; if (age <= 48) return 6; if (age <= 53) return 7;
  if (age <= 58) return 8; return 9;
}
function calcAge(birth){
  const b = new Date(birth + 'T12:00:00');
  if (isNaN(b.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
  return age;
}

function myQuotes(){ return DB.quotes.filter(q => q.userId === DB.session); }
function filteredQuotes(){
  let qs = myQuotes();
  const f = STATE.dashFilter;
  if (f.praca) qs = qs.filter(q => q.praca === f.praca);
  if (f.period !== 'all') {
    const days = { '7d':7, '30d':30, '90d':90, 'year':365 }[f.period] || 0;
    if (days) {
      const cutoff = Date.now() - days*86400000;
      qs = qs.filter(q => new Date(q.createdAt).getTime() >= cutoff);
    }
  }
  if (f.funnel) {
    const days = { 'd3':3, 'd7':7, 'd15':15 }[f.funnel];
    const cutoff = Date.now() - days*86400000;
    qs = qs.filter(q => isStaleLead(q, cutoff));
  }
  return qs;
}
function isStaleLead(q, cutoff){
  if (q.status === 'fechado' || q.status === 'perdido') return false;
  const last = new Date(q.lastContactAt || q.createdAt).getTime();
  return last < cutoff;
}

  } else {
    downloadCSV(rows, `relatorio-cotafacil-${Date.now()}.csv`);

  }

function downloadCSV(rows, filename){
  if (!rows.length) return toast('Sem dados para exportar');
  const headers = Object.keys(rows[0]);
  const lines = [headers.join(',')];
  rows.forEach(r => lines.push(headers.map(h => `"${String(r[h] ?? '').replace(/"/g,'""')}"`).join(',')));
  const blob = new Blob([lines.join('\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

    </div>

    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      <button class="btn" id="btnGerar">💾 Gerar proposta</button>
      <button class="btn ghost" id="btnLimpar">Limpar</button>
    </div>`;

  const cityEl = document.getElementById('qCity');
  const cepEl  = document.getElementById('qCep');
  const box    = document.getElementById('pracaBox');
  const manual = document.getElementById('qPracaManual');
  const births = [];

  function readLives(){ return [...document.querySelectorAll('.lifeIn')].map(i => Number(i.value)||0); }
  function readCT(){ return document.querySelector('input[name=ct]:checked').value; }
  function readAC(){ return document.querySelector('input[name=ac]:checked').value; }

  function updatePraca(){
    const forced = manual.value;
    STATE.detected = forced ? { praca:forced, match:'manual', detail:'Seleção manual' } : resolvePraca(cityEl.value, cepEl.value);
    if (!STATE.detected) {
      box.className = 'praca-box warn';
      box.innerHTML = `⚠️ Cidade não mapeada. Selecione a praça manualmente ou informe o CEP.`;
    } else {
      const d = STATE.detected;
      box.className = 'praca-box';
      const tag = d.match === 'exata' ? 'ok' : d.match === 'regional' ? 'info' : 'warn';
      box.innerHTML = `📍 Praça identificada: <b>${esc(d.praca)}</b> <span class="badge ${tag}" style="margin-left:6px">${d.match === 'exata' ? 'exata' : d.match === 'regional' ? 'regional por CEP' : d.match === 'manual' ? 'manual' : 'aproximada'}</span><div style="font-size:12.5px;color:var(--muted);margin-top:5px">${esc(d.detail)}</div>`;
    }
    updatePreview();
  }

  function updatePreview(){
    const lives = readLives();
    const total = lives.reduce((a,b)=>a+b,0);
    document.getElementById('totalLives').textContent = total;

    const ct = readCT(), ac = readAC();
    const warn = document.getElementById('ctWarn');
    if (ct === 'MEI' && total > 0 && (total < 1 || total > 29)) { warn.textContent = 'MEI: 1 a 29 vidas'; warn.classList.remove('hidden'); }
    else warn.classList.add('hidden');

    const card = document.getElementById('previewCard');
    if (!STATE.detected || !total) {
      card.innerHTML = `<h3>Planos disponíveis</h3><p style="color:var(--muted);font-size:13.5px">Informe a cidade, o tipo de contratação e as vidas.</p>`;
      return;
    }
    const plans = getPlans(STATE.detected.praca, ct, ac);
    if (!plans.length) {
      card.innerHTML = `<h3>Planos disponíveis</h3><p style="color:var(--err);font-size:13.5px">Nenhum plano cadastrado para esta combinação (${esc(ct)} · ${esc(ac)}). Cadastre no painel de Tabelas.</p>`;
      return;
    }
    // se o plano selecionado não existe mais nessa combinação, reseta para o primeiro
    if (!plans.find(p => p.id === STATE.quoteSelPlanId)) STATE.quoteSelPlanId = plans[0].id;
    const selected = plans.find(p => p.id === STATE.quoteSelPlanId);

    card.innerHTML = `
      <h3>Planos disponíveis — ${esc(STATE.detected.praca)} · ${esc(ct)} · ${esc(ac)}</h3>
      <p style="color:var(--muted);font-size:13px;margin-bottom:14px">Selecione o plano que deseja apresentar ao cliente:</p>
      <div class="plan-options">
        ${plans.map(pl => {
          const c = calc(pl, lives);
          const isSel = pl.id === STATE.quoteSelPlanId;
          return `<label class="plan-option ${isSel?'selected':''}" onclick="selectPlan('${pl.id}')">
            <input type="radio" name="planSel" value="${pl.id}" ${isSel?'checked':''}>
            <div class="plan-info">
              <div class="plan-name">${esc(pl.name)}</div>
              <div class="plan-prices">
                <div class="block"><span class="k">1º mês</span><span class="v promo">${money(c.first)}</span></div>
                <div class="block"><span class="k">2º mês em diante</span><span class="v">${money(c.afterGeneral)}</span></div>
                ${c.fd ? `<div class="block"><span class="k">Original</span><span class="v strike">${money(c.base)}</span></div>` : ''}
                ${c.fd ? `<div class="block"><span class="k">Desconto 1º mês</span><span class="v rec">${c.fd}% off</span></div>` : ''}
              </div>
            </div>
          </label>`;
        }).join('')}
      </div>
      <h3 style="margin-top:22px">Detalhes do plano selecionado — ${esc(selected.name)}</h3>
      <table class="preview-table">
        <thead><tr><th>Faixa etária</th><th class="num">Vidas</th><th class="num">Unitário</th><th class="num">Subtotal</th></tr></thead>
        <tbody>${calc(selected, lives).detail.map(d => `<tr><td>${d.faixa}</td><td class="num">${d.qty}</td><td class="num">${money(d.unit)}</td><td class="num"><b>${money(d.sub)}</b></td></tr>`).join('')}</tbody>
      </table>
      ${(() => { const c = calc(selected, lives); return `
        <div class="preview-values">
          <div><div class="lbl">Original</div><div class="num ${c.fd?'strike':''}">${money(c.base)}</div></div>
          <div><div class="lbl">2º mês em diante</div><div class="num">${money(c.afterGeneral)}</div></div>
          ${c.fd ? `<div class="price-pill">🔥 1º mês com ${c.fd}% off: ${money(c.first)}</div>` : ''}
        </div>`; })()}
    `;
  }

  window.selectPlan = id => {
    STATE.quoteSelPlanId = id;
    // Atualiza visual sem re-render completo
    document.querySelectorAll('.plan-option').forEach(el => el.classList.remove('selected'));
    document.querySelectorAll('.plan-option').forEach(el => {
      const r = el.querySelector('input[type=radio]');
      if (r.value === id) { el.classList.add('selected'); r.checked = true; }
    });
    updatePreview();
  };

  cityEl.oninput = updatePraca;
  cepEl.oninput = updatePraca;
  manual.onchange = updatePraca;
  document.querySelectorAll('.lifeIn').forEach(inp => inp.oninput = updatePreview);
  document.querySelectorAll('input[name=ct], input[name=ac]').forEach(r => r.onchange = () => { STATE.quoteSelPlanId = null; updatePreview(); });

  document.getElementById('btnAddBirth').onclick = () => {
    const dateVal = document.getElementById('birthDate').value;
    if (!dateVal) return toast('Informe a data de nascimento');
    const age = calcAge(dateVal);
    if (age === null || age < 0 || age > 120) return toast('Data inválida');
    const idx = ageToBracket(age);
    const inputs = document.querySelectorAll('.lifeIn');
    inputs[idx].value = (Number(inputs[idx].value)||0) + 1;
    births.push({ date:dateVal, age, bracket:idx });
    document.getElementById('birthDate').value = '';
    document.getElementById('birthLog').innerHTML = `${births.length} pessoa(s) adicionada(s) — última: ${age} anos → faixa <b>${ANS_BRACKETS[idx]}</b>`;
    updatePreview();
  };

  document.getElementById('btnGerar').onclick = () => {
    const name = document.getElementById('qName').value.trim();
    if (!name) return toast('Informe o nome do cliente');
    if (!STATE.detected) return toast('Praça não identificada');
    const lives = readLives();
    if (!lives.reduce((a,b)=>a+b,0)) return toast('Adicione ao menos uma vida');

    const ct = readCT(), ac = readAC();
    const plans = getPlans(STATE.detected.praca, ct, ac);
    if (!plans.length) return toast('Nenhum plano cadastrado para esta combinação');
    const plan = plans.find(p => p.id === STATE.quoteSelPlanId) || plans[0];
    const c = calc(plan, lives);

    DB.quotes.unshift({
      id:uid(), userId:DB.session, createdAt:new Date().toISOString(), lastContactAt:new Date().toISOString(),
      clientName:name, clientDoc:document.getElementById('qDoc').value.trim(),
      clientType:document.getElementById('qClientType').value,
      city:cityEl.value.trim(), cep:cepEl.value.trim(),
      praca:STATE.detected.praca, pracaMatch:STATE.detected.match,
      contractType:ct, acomodacao:ac,
      planId:plan.id, planName:plan.name,
      lives, detail:c.detail, totalLives:c.totalLives,
      base:c.base, afterGeneral:c.afterGeneral, first:c.first, fd:c.fd, gd:c.gd,
      status:'enviado', opens:0, births
    });
    notify('Cotação gerada: ' + name + ' (' + plan.name + ' · ' + ac + ')');
    save(); toast('Proposta gerada!');
    STATE.view = 'proposals'; renderView();
  };
  document.getElementById('btnLimpar').onclick = () => { STATE.quoteSelPlanId = null; STATE.view = 'quote'; renderView(); };

  updatePraca();
}

function getQuote(id){ return DB.quotes.find(q => q.id === id); }
function setStatus(id, status){ const q = getQuote(id); if (!q) return; q.status = status; if (status==='fechado') notify('Proposta fechada: '+q.clientName); if (status==='perdido') notify('Proposta perdida: '+q.clientName); save(); renderView(); toast('Status atualizado'); }
function markContact(id){ const q = getQuote(id); if (!q) return; q.lastContactAt = new Date().toISOString(); if (q.status==='enviado') q.status='contato'; save(); renderView(); toast('Contato registrado'); }
function delQuote(id){ if (!confirm('Excluir esta proposta?')) return; DB.quotes = DB.quotes.filter(q => q.id !== id); save(); renderView(); toast('Excluída'); }
function shareLink(q){ const payload = btoa(encodeURIComponent(JSON.stringify({ q, u: (DB.users.find(u=>u.id===q.userId)||{}) }))); return location.href.split('#')[0] + '#p=' + payload; }
function copyLink(id){ navigator.clipboard.writeText(shareLink(getQuote(id))).then(()=>toast('Link copiado!')).catch(()=>toast('Não foi possível copiar')); }
function shareWhats(id){
  const q = getQuote(id); const u = DB.users.find(x => x.id === q.userId) || {};

  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function adminSetCT(ct){ adminSilentSave(); STATE.adminCT = ct; STATE.adminPlanId = null; renderView(); }
function adminSetAC(ac){ adminSilentSave(); STATE.adminAC = ac; STATE.adminPlanId = null; renderView(); }
function adminSetPlan(id){ adminSilentSave(); STATE.adminPlanId = id; renderView(); }

function adminQuickDisc(kind, val){
  if (kind === 'first') { document.getElementById('dFirstRange').value = val; document.getElementById('dFirstVal').textContent = val+'%'; }
  else { document.getElementById('dGenRange').value = val; document.getElementById('dGenVal').textContent = val+'%'; }
  updateMiniPreview();
}

function updateMiniPreview(){
  const box = document.getElementById('miniPreview'); if (!box) return;
  const p = STATE.selPraca, ct = STATE.adminCT || 'PF', ac = STATE.adminAC || 'Ambulatorial';
  const prices = [...document.querySelectorAll('.price-input')].map(i => Number(i.value)||0);
  const fd = Number(document.getElementById('dFirstRange').value)||0;
  const gd = Number(document.getElementById('dGenRange').value)||0;
  const planName = document.getElementById('planName')?.value || 'Plano';
  const idx = 4;
  const unit = prices[idx];
  const afterGen = unit * (1 - gd/100);
  const firstMonth = afterGen * (1 - fd/100);

  box.innerHTML = `
    <h4>💡 Prévia em tempo real — ${esc(planName)} · ${esc(p)} · ${esc(ct)} · ${esc(ac)}</h4>
    <div class="example">
      <div class="col"><div class="k">Exemplo: 1 vida 34-38</div><div class="v">${money(unit)}</div></div>
      <div class="col"><div class="k">Original</div><div class="v ${fd||gd?'strike':''}">${money(unit)}</div></div>
      <div class="col"><div class="k">2º mês+</div><div class="v">${money(afterGen)}</div></div>
      ${fd ? `<div class="col"><div class="k">1º mês (${fd}%)</div><div class="v promo">${money(firstMonth)}</div></div>` : ''}
    </div>`;
}

function adminBulkAdjust(){
  const pct = Number(document.getElementById('bulkPct').value);
  if (!pct || isNaN(pct)) return toast('Informe um percentual');
  document.querySelectorAll('.price-input').forEach(inp => {
    const v = Number(inp.value)||0;
    inp.value = (v * (1 + pct/100)).toFixed(2);
  });
  updateMiniPreview();
  toast(`Ajuste ${pct>0?'+':''}${pct}% aplicado`);
}

/* Salva silenciosamente os valores atuais do plano em edição */
function adminSilentSave(){
  const p = STATE.selPraca, ct = STATE.adminCT || 'PF', ac = STATE.adminAC || 'Ambulatorial';
  if (!p || !DB.tables[p]?.[ct]?.[ac]) return;
  const plans = DB.tables[p][ct][ac];
  const plan = plans.find(x => x.id === STATE.adminPlanId);
  if (!plan) return;
  const nameEl = document.getElementById('planName');
  const dFirstEl = document.getElementById('dFirstRange');
  const dGenEl = document.getElementById('dGenRange');
  if (!nameEl || !dFirstEl || !dGenEl) return;
  plan.name = nameEl.value.trim() || plan.name;
  plan.prices = [...document.querySelectorAll('.price-input')].map(i => Number(i.value)||0);
  plan.discount.firstMonth = Number(dFirstEl.value)||0;
  plan.discount.general = Number(dGenEl.value)||0;
  save();
}

function adminSave(){
  adminSilentSave();
  const ind = document.getElementById('savedInd');
  if (ind) { ind.classList.add('show'); setTimeout(()=>ind.classList.remove('show'), 2000); }
  const p = STATE.selPraca, ct = STATE.adminCT || 'PF', ac = STATE.adminAC || 'Ambulatorial';
  notify('Plano salvo: ' + p + ' / ' + ct + ' / ' + ac);
  toast('Plano salvo');
  // atualiza o base no sidebar
  const first = DB.tables[p]?.PF?.Ambulatorial?.[0];
  if (first) {
    const item = [...document.querySelectorAll('.praca-item')].find(el => el.dataset.praca === p);
    if (item) item.querySelector('.base').textContent = moneyShort(first.prices[0]);
  }
}

function adminAddPlan(){
  adminSilentSave();
  const p = STATE.selPraca, ct = STATE.adminCT || 'PF', ac = STATE.adminAC || 'Ambulatorial';
  const plans = DB.tables[p][ct][ac];
  const name = prompt('Nome do novo plano:', 'Plano ' + (plans.length+1));
  if (!name) return;
  const base = plans[0]?.prices || AGE_FACTORS.map(f => 100*f);
  const newPlan = makePlan(name.trim(), base.slice(), 0, 0);
  plans.push(newPlan);
  STATE.adminPlanId = newPlan.id;
  save(); renderView(); toast('Plano criado');
}

function adminDuplicatePlan(){
  adminSilentSave();
  const p = STATE.selPraca, ct = STATE.adminCT || 'PF', ac = STATE.adminAC || 'Ambulatorial';
  const plans = DB.tables[p][ct][ac];
  const plan = plans.find(x => x.id === STATE.adminPlanId);
  if (!plan) return;
  const copy = makePlan(plan.name + ' (cópia)', plan.prices.slice(), plan.discount.firstMonth, plan.discount.general);
  plans.push(copy);
  STATE.adminPlanId = copy.id;
  save(); renderView(); toast('Plano duplicado');
}

function adminDeletePlan(){
  const p = STATE.selPraca, ct = STATE.adminCT || 'PF', ac = STATE.adminAC || 'Ambulatorial';
  const plans = DB.tables[p][ct][ac];
  if (plans.length <= 1) return toast('Cada combinação precisa de ao menos 1 plano');
  const plan = plans.find(x => x.id === STATE.adminPlanId);
  if (!plan) return;
  if (!confirm('Excluir o plano "' + plan.name + '"? Cotações antigas não são afetadas.')) return;
  DB.tables[p][ct][ac] = plans.filter(x => x.id !== plan.id);
  STATE.adminPlanId = DB.tables[p][ct][ac][0].id;
  save(); renderView(); toast('Plano excluído');
}

function adminCopyFrom(){
  const from = document.getElementById('copyFrom').value;
  if (!from) return toast('Selecione a filial de origem');
  const p = STATE.selPraca, ct = STATE.adminCT || 'PF', ac = STATE.adminAC || 'Ambulatorial';
  const source = getPlans(from, ct, ac);
  if (!source.length) return toast('Sem dados nessa combinação');
  if (!confirm(`Substituir todos os planos desta combinação (${ct} · ${ac}) pelos de "${from}"?`)) return;
  DB.tables[p][ct][ac] = source.map(pl => makePlan(pl.name, pl.prices.slice(), pl.discount.firstMonth, pl.discount.general));
  STATE.adminPlanId = DB.tables[p][ct][ac][0].id;
  save(); renderView(); toast('Planos copiados de "' + from + '"');
}

function editCities(p){
  const atual = (DB.pracas[p]||[]).join(', ');
  const novo = prompt('Cidades da praça ' + p + ' (separadas por vírgula):', atual);
  if (novo === null) return;
  DB.pracas[p] = novo.split(',').map(s=>s.trim()).filter(Boolean);
  save(); renderView(); toast('Cidades atualizadas');
}

function addPraca(){
  const nome = prompt('Nome da nova praça (filial):');
  if (!nome) return;
  if (DB.tables[nome]) return toast('Praça já existe');
  DB.tables[nome] = {};
  for (const ct of ['PF','MEI','ME']) {
    DB.tables[nome][ct] = {};
    for (const ac of ACCOMMODATIONS) {
      const base = 180 * TYPE_FACTOR[ct] * ac.mult;
      DB.tables[nome][ct][ac.id] = [makePlan('Essencial', AGE_FACTORS.map(f => base * f), 0, 0)];
    }
  }
  DB.pracas[nome] = [];
  STATE.selPraca = nome; STATE.adminPlanId = null;
  save(); renderView(); toast('Praça criada');
}

function delPraca(p){
  if (Object.keys(DB.tables).length <= 1) return toast('Mantenha ao menos uma praça');
  if (!confirm('Remover a praça "' + p + '"?')) return;
  delete DB.tables[p]; delete DB.pracas[p];
  STATE.selPraca = Object.keys(DB.tables)[0]; STATE.adminPlanId = null;
  save(); renderView(); toast('Praça removida');
}

function handleFile(file){
  const reader = new FileReader();
  reader.onload = e => {
    let rows = [];
    try {
      if (file.name.toLowerCase().endsWith('.csv')) rows = parseCSV(e.target.result);
      else if (window.XLSX) {
        const wb = XLSX.read(e.target.result, { type:'binary' });
        rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' });
      } else return toast('Para Excel, use CSV (SheetJS offline).');
    } catch(err){ console.error(err); return toast('Erro ao ler o arquivo'); }
    if (!rows.length) return toast('Planilha vazia');
    window.__importRows = normalizeImport(rows);
    showImportPreview(window.__importRows);
  };
  if (file.name.toLowerCase().endsWith('.csv')) reader.readAsText(file, 'UTF-8');
  else reader.readAsBinaryString(file);
}

function parseCSV(text){
  const lines = [];
  let cur = '', row = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') inQ = false;
      else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') {
        if (cur !== '' || row.length) { row.push(cur); lines.push(row); row = []; cur = ''; }
        if (c === '\r' && text[i+1] === '\n') i++;
      } else cur += c;
    }
  }
  if (cur !== '' || row.length) { row.push(cur); lines.push(row); }
  if (!lines.length) return [];
  const headers = lines[0].map(h => norm(h));
  return lines.slice(1).filter(l => l.some(c => c.trim() !== '')).map(l => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = l[i] ?? '');
    return obj;
  });
}

function normalizeImport(rows){
  const findKey = (obj, variants) => {
    for (const k of Object.keys(obj)) for (const v of variants) if (k === norm(v) || k.includes(norm(v))) return k;
    return null;
  };
  return rows.map(r => {
    const kFilial = findKey(r, ['filial','praca','praça','cidade']);
    const kPlano  = findKey(r, ['plano','produto','nome do plano']);
    const kTab    = findKey(r, ['tabela','contratacao','contratação','tipo']);
    const kAc     = findKey(r, ['acomodacao','acomodação','acomod']);
    const kDesc1  = findKey(r, ['desc1mes','desconto 1','desc 1','1º mes','primeiro mes']);
    const kDescG  = findKey(r, ['descrecorrente','desconto geral','desc geral','desc recorrente']);
    const filial = String(r[kFilial] || '').trim();
    const plano  = String(r[kPlano]  || '').trim() || 'Padrão';
    const tabRaw = String(r[kTab] || '').trim().toUpperCase().replace(/[^A-Z]/g,'');
    const acRaw  = norm(r[kAc] || '');
    const tabela = tabRaw === 'PF' ? 'PF' : tabRaw === 'MEI' ? 'MEI' : (tabRaw === 'ME' || tabRaw === 'PJ' || tabRaw === 'ME/DEMAISEMPRESAS') ? 'ME' : null;
    const acomodacao = acRaw.includes('ambul') ? 'Ambulatorial' : acRaw.includes('enferm') ? 'Enfermaria' : acRaw.includes('apart') ? 'Apartamento' : null;
    const prices = [];
    for (let i = 0; i < ANS_BRACKETS.length; i++) {
      const b = ANS_BRACKETS[i];
      const variants = [b, b.replace(' a ','-'), b.replace(' ou mais','+'), b.split(' ')[0]+'-'+b.split(' ')[2]];
      const k = findKey(r, variants);
      const v = parseFloat(String(r[k]||'').replace(/[^\d,.-]/g,'').replace(',','.'));
      prices.push(isFinite(v) ? v : NaN);
    }
    const d1 = parseFloat(String(r[kDesc1]||'0').replace(/[^\d,.-]/g,'').replace(',','.')) || 0;
    const dg = parseFloat(String(r[kDescG]||'0').replace(/[^\d,.-]/g,'').replace(',','.')) || 0;
    const errors = [];
    if (!filial) errors.push('Filial vazia');
    if (!tabela) errors.push('Tabela inválida');
    if (!acomodacao) errors.push('Acomodação inválida');
    if (prices.some(p => !isFinite(p))) errors.push('Preço inválido');
    return { filial, plano, tabela, acomodacao, prices, desc1:d1, descG:dg, errors };
  });
}

function showImportPreview(rows){
  const valid = rows.filter(r => !r.errors.length).length;
  document.getElementById('importPreviewBox').innerHTML = `

      <b style="font-size:13px">Prévia (${rows.length} linhas · ${valid} válidas)</b>
      <span class="badge ${valid===rows.length?'ok':'warn'}">${valid===rows.length?'✓ tudo OK':'⚠ verifique os erros'}</span>
    </div>
    <div class="import-preview">
      <table>
        <thead><tr><th>Filial</th><th>Plano</th><th>Tabela</th><th>Acomodação</th><th>0-18</th><th>59+</th><th>Desc 1º</th><th>Desc Geral</th><th>Status</th></tr></thead>
        <tbody>${rows.slice(0,50).map(r => `

            <td>${r.desc1}%</td>
            <td>${r.descG}%</td>
            <td>${r.errors.length ? '<span class="badge err">'+r.errors.join(', ')+'</span>' : '<span class="badge ok">OK</span>'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  document.getElementById('btnConfirmImport').disabled = valid === 0;
}

function confirmImport(){
  const rows = (window.__importRows || []).filter(r => !r.errors.length);
  if (!rows.length) return toast('Nenhuma linha válida');
  let newPracas = 0, newPlans = 0, updatedPlans = 0;
  rows.forEach(r => {
    if (!DB.tables[r.filial]) {
      DB.tables[r.filial] = { PF:{}, MEI:{}, ME:{} };
      for (const ct of ['PF','MEI','ME']) for (const a of ACCOMMODATIONS) {
        DB.tables[r.filial][ct][a.id] = [];
      }
      if (!DB.pracas[r.filial]) DB.pracas[r.filial] = [];
      newPracas++;
    }
    const arr = DB.tables[r.filial][r.tabela][r.acomodacao];
    if (!Array.isArray(arr)) DB.tables[r.filial][r.tabela][r.acomodacao] = [];
    const list = DB.tables[r.filial][r.tabela][r.acomodacao];
    const existing = list.find(pl => norm(pl.name) === norm(r.plano));
    if (existing) {
      existing.prices = r.prices;
      existing.discount = { firstMonth:r.desc1, general:r.descG };
      updatedPlans++;
    } else {
      list.push(makePlan(r.plano, r.prices, r.desc1, r.descG));
      newPlans++;
    }
  });
  save();
  notify(`Importação: ${rows.length} linha(s) · ${newPracas} nova(s) filial(is) · ${newPlans} plano(s) novo(s) · ${updatedPlans} atualizado(s)`);
  closeModal();
  toast(`✅ ${rows.length} linha(s) importada(s)`);
  renderView();
}

function downloadTemplate(){
  const rows = [];
  for (const praca of Object.keys(DB.tables).sort()) {
    for (const ct of ['PF','MEI','ME']) {
      for (const ac of ACCOMMODATIONS) {
        const list = DB.tables[praca][ct]?.[ac.id] || [];
        list.forEach(pl => {
          const row = { 'Filial':praca, 'Plano':pl.name, 'Tabela':ct, 'Acomodacao':ac.id };
          ANS_BRACKETS.forEach((b,i) => row[b] = pl.prices[i].toFixed(2));
          row['Desc1Mes'] = pl.discount.firstMonth;
          row['DescRecorrente'] = pl.discount.general;
          rows.push(row);
        });
      }
    }
  }
  if (!rows.length) return toast('Sem dados');
  const headers = Object.keys(rows[0]);
  const lines = [headers.join(',')];
  rows.forEach(r => lines.push(headers.map(h => `"${String(r[h] ?? '').replace(/"/g,'""')}"`).join(',')));
  const blob = new Blob([lines.join('\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'template-cotafacil.csv'; a.click();
  toast('Template baixado');
}

   15. PROPOSTA PÚBLICA
   ========================================================================= */
function renderPublic(){
  const raw = location.hash.slice(3);
  let data;
  try { data = JSON.parse(decodeURIComponent(atob(raw))); }
  catch(e){ document.getElementById('publicInner').innerHTML = '<div class="prop"><div class="prop-body"><h3>Link inválido</h3></div></div>'; document.getElementById('publicView').classList.remove('hidden'); document.getElementById('authScreen').classList.add('hidden'); return; }
  const { q, u } = data;
  const local = DB.quotes.find(x => x.id === q.id);
  if (local) { local.opens = (local.opens||0) + 1; save(); }
  document.getElementById('publicInner').innerHTML = `<div class="prop">${proposalBody(q, u || {})}</div><div style="text-align:center;margin-top:22px;color:#94a3b8;font-size:12.5px">Proposta gerada por <b style="color:#e2e8f0">CotaFácil</b></div>`;
  document.getElementById('publicView').classList.remove('hidden');
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.add('hidden');
}

/* =========================================================================
   16. UTIL
   ========================================================================= */
let toastTimer = null;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.remove(), 2800);
}

if (location.hash.startsWith('#p=')) renderPublic();
